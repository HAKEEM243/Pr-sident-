  <h1>Population</h1>
  <div class="subtitle">${fmtNum(c.population)} habitants — répartis en classes sociales, professions et générations, chacune avec ses propres attentes.</div>
  <div class="grid cols2">
    <div class="card">
      <h3>Vue d'ensemble</h3>
      <div class="row"><span class="rl">Population totale</span><span class="rv num">${fmtNum(c.population)}</span></div>
      <div class="row"><span class="rl">Taux de pauvreté</span><span class="rv num ${poverty>45?'neg':(poverty>25?'':'pos')}">${poverty} %</span></div>
      <div class="row"><span class="rl">Satisfaction générale</span><span class="rv">${overall!=null?satisfPill(overall):'—'}</span></div>
      <div class="row"><span class="rl">Espérance de vie</span><span class="rv num">${c.social.lifeExpectancy} ans</span></div>
      <div class="row"><span class="rl">Coût de la vie estimé</span><span class="rv num">${fmtMoney(col)}/mois</span></div>
      <p class="hint" style="margin-top:8px;">Une décision qui plaît à un groupe peut en mécontenter un autre : surveillez les deux colonnes ci-dessous.</p>
    </div>
    <div class="card">
      <h3>Qui vous soutient, qui vous en veut</h3>
      <div class="row"><span class="rl" style="color:var(--parchment)">Groupes les plus satisfaits</span><span></span></div>
      ${happiest.map(g=>`<div class="row"><span class="rl">${escapeHtml(g.label)}</span><span class="rv">${satisfPill(g.sat)}</span></div>`).join('')}
      <div class="row" style="margin-top:10px;"><span class="rl" style="color:var(--parchment)">Groupes les plus mécontents</span><span></span></div>
      ${angriest.map(g=>`<div class="row"><span class="rl">${escapeHtml(g.label)}</span><span class="rv">${satisfPill(g.sat)}</span></div>`).join('')}
    </div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3>Salaire brut mensuel par métier</h3>
    <p class="hint" style="margin-top:-4px;">Aucun plafond : fixez librement le salaire brut de chaque profession. Payer davantage améliore le pouvoir d'achat et la satisfaction, mais alourdit la dépense publique, pousse l'inflation et le chômage.</p>
    <div class="grid cols2" style="margin-top:6px;">
      ${numberField('Salaire minimum national', c.salaries.minWage, 'setMinWage(this.value)', '$ brut/mois')}
      <div class="field"><label>Grille salariale</label>
        <div class="slider-row"><button class="btn sm" onclick="alignSalariesToMinWage()">Réaligner sur le salaire minimum</button></div>
      </div>
    </div>
    <div class="row"><span class="rl">Niveau des salaires vs. économie du pays</span><span class="rv"><span class="pill ${sp>1.35?'bad':(sp>1.1?'warn':(sp<0.75?'warn':'good'))}">×${round1(sp)}</span></span></div>
    <div class="row"><span class="rl">Masse salariale publique estimée</span><span class="rv num">${fmtMoney(payroll)}/mois</span></div>
    <div class="grid cols2" style="margin-top:10px;">
      ${PROFESSIONS.filter(p=>p.salaryMult>0).map(p=>numberField(p.label, c.salaries.byProfession[p.key]||0, `setSalary('${p.key}',this.value)`, '$ brut/mois')).join('')}
    </div>
    <p class="hint">Retraités et chômeurs sont rémunérés via le niveau des pensions et des allocations (onglet Social), calculés sur le salaire minimum.</p>
  </div>

  <div class="grid cols2" style="margin-top:14px;">
    <div class="card">
      <h3>Classes sociales</h3>
      ${popGroupRows(SOCIAL_CLASSES, d.classes, ind, c.population, true)}
    </div>
    <div class="card">
      <h3>Générations</h3>
      ${popGroupRows(GENERATIONS, d.generations, ind, c.population, false)}
      <p class="hint" style="margin-top:8px;">Les enfants ne sont pas comptés dans l'opinion politique.</p>
    </div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3>Professions</h3>
    <div class="grid cols2">
      ${popGroupRows(PROFESSIONS, d.professions, ind, c.population, true)}
    </div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3>Opinion du pays par sujet</h3>
    <p class="hint" style="margin-top:-4px;">Note moyenne du pays sur chaque sujet, pondérée par le poids de chaque groupe.</p>
    <div class="grid cols2">
      ${OPINION_TOPICS.map(t=>{
        let sum=0, w=0;
        SOCIAL_CLASSES.forEach(g=>{ const gw=d.classes[g.key]||0; sum += groupTopicScore(g.key, ind, t.key)*gw; w+=gw; });
        PROFESSIONS.forEach(g=>{ const gw=d.professions[g.key]||0; sum += groupTopicScore(g.key, ind, t.key)*gw; w+=gw; });
        const v = w>0 ? sum/w : 50;
        return `<div class="row"><span class="rl">${escapeHtml(t.label)}<span class="bar" style="margin-top:5px;"><i style="width:${clamp(v,0,100)}%"></i></span></span><span class="rv">${satisfPill(v)}</span></div>`;
      }).join('')}
    </div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3>Institutions &amp; société</h3>
    <div class="grid cols2">
      <div class="row"><span class="rl">Corruption <span style="font-size:11px;color:var(--muted-2);">(bas = mieux)</span></span><span class="rv"><span class="pill ${c.social.corruption<30?'good':(c.social.corruption<60?'warn':'bad')}">${c.social.corruption}/100</span></span></div>
      <div class="row"><span class="rl">Indépendance de la justice</span><span class="rv"><span class="pill ${c.police.justiceIndex>=60?'good':(c.police.justiceIndex>=40?'warn':'bad')}">${c.police.justiceIndex}/100</span></span></div>
      <div class="row"><span class="rl">Libertés publiques</span><span class="rv"><span class="pill ${c.social.liberty>=60?'good':(c.social.liberty>=35?'warn':'bad')}">${c.social.liberty}/100</span></span></div>
      <div class="row"><span class="rl">Place de la religion</span><span class="rv num">${c.social.religiosity}/100</span></div>
    </div>
    <p class="hint" style="margin-top:8px;">Le régime politique tire progressivement les libertés et la religiosité vers son propre niveau ; la justice et l'éducation font reculer la corruption.</p>
  </div>`;
}

/* ---- Parlement ---- */
function renderParliament(){
  const c = playerState();
  const pl = state.parliament;
  if(!pl || !pl.seats) return `<h1>Parlement</h1><div class="empty">Le Parlement n'est pas encore constitué.</div>`;
  const total = pl.total||300;
  const coal = coalitionSeats();
  const maj = hasMajority();
  const sorted = PARTIES.slice().sort((a,b)=>(pl.seats[b.key]||0)-(pl.seats[a.key]||0));
  const el = state.lastElection;
  const mandatePct = Math.round(c.mandate.turnsElapsed/c.mandate.length*100);
  return `
  <h1>Parlement</h1>
  <div class="subtitle">${total} sièges — la composition découle du vote réel des professions et de leur satisfaction.</div>
  <div class="grid cols2">
    <div class="card">
      <h3>Composition de l'Assemblée</h3>
      <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin:8px 0 12px;">
        ${sorted.map(p=>`<div title="${escapeHtml(p.label)}" style="width:${(pl.seats[p.key]||0)/total*100}%;background:${p.color};"></div>`).join('')}
      </div>
      ${sorted.map(p=>{
        const s = pl.seats[p.key]||0;
        const isPres = p.key===pl.presidentialParty;
        const inCoal = (pl.coalition||[]).indexOf(p.key)>=0;
        return `<div class="row">
          <span class="rl"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${p.color};margin-right:6px;"></span>${escapeHtml(p.label)}
            ${isPres?'<span class="pill info">Parti présidentiel</span>':(inCoal?'<span class="pill good">Coalition</span>':'')}</span>
          <span style="text-align:right;white-space:nowrap;">
            <span class="rv num">${s} sièges</span>
            ${!isPres?`<button class="btn sm" style="margin-left:8px;" onclick="toggleCoalition('${p.key}')">${inCoal?'Quitter':'Allier'}</button>`:''}
          </span>
        </div>`;
      }).join('')}
      <div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;">
        <span class="rl" style="color:var(--parchment)">Majorité présidentielle</span>
        <span class="rv"><span class="pill ${maj?'good':'bad'}">${coal} / ${total} — ${maj?'majorité absolue':'minorité'}</span></span>
      </div>
    </div>
    <div class="card">
      <h3>Votre camp politique</h3>
      <div class="field"><label>Parti présidentiel</label>
        <select onchange="setPresidentialParty(this.value)">
          ${PARTIES.map(p=>`<option value="${p.key}" ${pl.presidentialParty===p.key?'selected':''}>${escapeHtml(p.label)}</option>`).join('')}
        </select>
      </div>
      <p class="hint" style="margin-top:-6px;">Les groupes satisfaits prêtent leurs voix à votre camp ; les mécontents retournent vers leur parti naturel.</p>
      <div class="field"><label>Élections de fin de mandat</label>
        <select onchange="setElectionsEnabled(this.value==='1')">
          <option value="1" ${pl.electionsEnabled!==false?'selected':''}>Activées — vous pouvez perdre le pouvoir</option>
          <option value="0" ${pl.electionsEnabled===false?'selected':''}>Désactivées (bac à sable)</option>
        </select>
      </div>
      ${el ? `<div class="row" style="margin-top:8px;"><span class="rl">Dernière élection</span><span class="rv"><span class="pill ${el.won?'good':'bad'}">${el.score} % — ${el.won?'réélu(e)':'battu(e)'}</span></span></div>` : ''}
      <div class="row"><span class="rl">Progression du mandat</span><span class="rv num">${mandatePct} %</span></div>
      <div class="bar"><i style="width:${mandatePct}%"></i></div>
      ${pl.lastVote ? `<p class="hint" style="margin-top:10px;">Dernier vote : « ${escapeHtml(pl.lastVote.label)} » — <b style="color:${pl.lastVote.passed?'var(--gain)':'var(--loss)'}">${pl.lastVote.passed?'adoptée':'rejetée'}</b> (${pl.lastVote.yes} pour / ${pl.lastVote.no} contre).</p>` : ''}
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <h3>Propositions de loi</h3>
    <p class="hint" style="margin-top:-4px;">Chaque loi est soumise au vote : elle passe si elle réunit plus de la moitié des sièges. Sans majorité, il faut élargir la coalition.</p>
    <div class="grid cols2" style="margin-top:6px;">
      ${LAWS.map(l=>{
        const done = (pl.passedLaws||[]).indexOf(l.key)>=0;
        const v = lawVote(l);
        return `<div class="row" style="align-items:flex-start;">
          <span class="rl">${escapeHtml(l.label)}<br><span style="font-size:11px;color:var(--muted-2);">${escapeHtml(l.desc)}</span>
            <span style="display:block;font-size:11px;margin-top:4px;color:${v.passed?'var(--gain)':'var(--loss)'};">Vote estimé : ${v.yes} pour / ${v.no} contre</span></span>
          <span style="text-align:right;white-space:nowrap;">
            ${done ? '<span class="pill good">Adoptée</span>'
                   : `<button class="btn sm" onclick="proposeLaw('${l.key}')">Soumettre au vote</button>`}
          </span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
function renderDefeat(){
  const c = playerState();
  const rep = presidencyReport();
  const el = state.lastElection || {score:0};
  const sign = v => (v>0?'+':'')+v;
  return `<div class="select-screen"><div class="select-inner" style="max-width:760px;">
    <h1>Défaite électorale</h1>
    <div class="subtitle">Vous avez été battu(e) avec ${el.score} % des suffrages après ${c.mandate.term} mandat(s) à la tête de ${escapeHtml(c.name)}.</div>
    ${rep ? `<div class="card" style="margin-top:16px;text-align:left;">
      <h3>Bilan de votre présidence</h3>
      <div class="grid cols2" style="margin-top:8px;">
        ${rep.metrics.map(m=>`<div class="row"><span class="rl">${escapeHtml(m.label)}</span><span class="rv num ${m.value*m.good>0?'pos':(m.value*m.good<0?'neg':'')}">${sign(m.value)}${m.unit}</span></div>`).join('')}
      </div>
      <p class="hint" style="margin-top:10px;line-height:1.6;color:var(--parchment);">${escapeHtml(presidencyNarrative(rep))}</p>
    </div>` : ''}
    <div class="btn-row" style="margin-top:18px;justify-content:center;flex-wrap:wrap;gap:8px;">
      <button class="btn primary" onclick="continueAfterDefeat()">Continuer quand même (bac à sable)</button>
      <button class="btn" onclick="resetGame()">Nouvelle partie</button>
      <button class="btn" onclick="exportSave()">Exporter la sauvegarde</button>
    </div>
  </div></div>`;
}

/* ---- Resources ---- */
function renderResources(){
  const c = playerState();
  const rs = (c.resources||[]).slice().sort((a,b)=> resourceRevenue(c,b)-resourceRevenue(c,a));
  const total = totalResourceRevenue(c);
  const monthlyGdp = c.gdp*1e9/12;
  return `
  <h1>Ressources naturelles</h1>
  <div class="subtitle">${escapeHtml(c.name)} exploite ${rs.filter(r=>r.exploited).length} gisement(s) sur ${rs.length}.</div>
  <div class="card">
    <h3>Revenus des ressources</h3>
    <div class="row"><span class="rl">Ventes totales</span><span class="rv num pos">${fmtMoney(total)}/mois</span></div>
    <div class="row"><span class="rl">Soit par an</span><span class="rv num pos">${fmtMoney(total*12)}</span></div>
    <div class="row"><span class="rl">Part du PIB mensuel</span><span class="rv num">${monthlyGdp>0?round1(total/monthlyGdp*100):0} %</span></div>
    <p class="hint" style="margin-top:6px;">Investir dans l'exploitation augmente la production (jusqu'à ×2). Investir dans le raffinage transforme la matière brute et augmente le prix de vente (pétrole → carburant, minerai → métal).</p>
  </div>
  <div class="grid cols2" style="margin-top:14px;">
    ${rs.map(r=>{
      const prod = resourceProduction(c, r);
      const rev = resourceRevenue(c, r);
      const rk = resourceRankOf(c.id, r.type);
      const top = resourceRanking(r.type, 3);
      const months = prod>0 ? Math.round((r.reserves||0)/prod) : null;
      const extCost = resourceUpgradeCost(c, r, 'extraction');
      const refCost = resourceUpgradeCost(c, r, 'refining');
      const trend = r.prevPrice!=null ? (r.price>r.prevPrice?'▲':(r.price<r.prevPrice?'▼':'—')) : '';
      return `
      <div class="card">
        <h3>${escapeHtml(r.name)} ${rk.rank && rk.rank<=3 ? `<span class="pill good">${rk.rank}${rk.rank===1?'er':'e'} mondial</span>` : ''}</h3>
        <div class="row"><span class="rl">Production</span><span class="rv num">${fmtNum(prod)} <span style="color:var(--muted-2);">unités/mois</span></span></div>
        <div class="row"><span class="rl">Revenu de vente</span><span class="rv num pos">${fmtMoney(rev)}/mois</span></div>
        <div class="row"><span class="rl">Cours mondial</span><span class="rv num ${r.prevPrice!=null && r.price>r.prevPrice?'pos':(r.prevPrice!=null && r.price<r.prevPrice?'neg':'')}">${r.price} $ ${trend}</span></div>
        <div class="row"><span class="rl">Prix de vente après raffinage</span><span class="rv num">${round1(resourceUnitValue(r))} $</span></div>
        <div class="row"><span class="rl">Réserves</span><span class="rv num">${fmtNum(r.reserves||0)}${months!=null?` <span style="color:var(--muted-2);">(~${months} mois)</span>`:''}</span></div>
        <div class="row"><span class="rl">Qualité du gisement</span><span class="rv num">×${round1(r.grade!=null?r.grade:1)}</span></div>
        <div class="row"><span class="rl">Exploitation</span><span class="rv num">${r.extraction||0} / 200 %</span></div>
        <div class="bar"><i style="width:${clamp((r.extraction||0)/2,0,100)}%"></i></div>
        <div class="row" style="margin-top:6px;"><span class="rl">Raffinage</span><span class="rv num">${r.refining||0} / 100 %</span></div>
        <div class="bar good"><i style="width:${clamp(r.refining||0,0,100)}%"></i></div>
        <div class="row" style="margin-top:8px;"><span class="rl">Rang mondial</span><span class="rv num">${rk.rank ? `${rk.rank}${rk.rank===1?'er':'e'} sur ${rk.total}` : '—'}</span></div>
        <div style="font-size:11px;color:var(--muted-2);margin-top:4px;">
          ${top.map((t,i)=>`${i+1}. ${flagEmoji(t.iso2)} ${escapeHtml(t.name)} — ${fmtNum(t.production)}`).join('<br>')}
        </div>
        <div class="btn-row" style="margin-top:10px;flex-wrap:wrap;gap:6px;">
          <button class="btn sm" onclick="investResource('${r.id}','extraction')">+10 % exploitation (${fmtMoney(extCost)})</button>
          <button class="btn sm" onclick="investResource('${r.id}','refining')">+10 % raffinage (${fmtMoney(refCost)})</button>
          <button class="btn sm" onclick="toggleExploit('${r.id}')">${r.exploited?'Suspendre':'Exploiter'}</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="card" style="margin-top:14px;">
    <h3>Prospection</h3>
    <p>Financez une campagne de prospection pour découvrir de nouveaux gisements ou étendre les réserves existantes.</p>
    <div class="btn-row"><button class="btn primary" onclick="prospect()">Lancer une prospection (${fmtMoney(c.gdp*1e9*0.002)})</button></div>
  </div>
  <div class="card" style="margin-top:14px;">
    <h3>Classement mondial des producteurs</h3>
    <p class="hint" style="margin-top:-4px;">Les trois premiers producteurs de chaque ressource, sur les 195 pays. Votre pays est mis en évidence.</p>
    <div class="grid cols2" style="margin-top:6px;">
      ${RESOURCE_POOL.map(def=>{
        const top = resourceRanking(def.type, 3);
        if(!top.length) return '';
        return `<div class="row" style="align-items:flex-start;">
          <span class="rl">${escapeHtml(def.name)}<br>
            <span style="font-size:11px;color:var(--muted-2);">
              ${top.map((t,i)=>`${i+1}. ${flagEmoji(t.iso2)} ${t.id===c.id?'<b style="color:var(--brass)">'+escapeHtml(t.name)+'</b>':escapeHtml(t.name)}`).join('<br>')}
            </span>
          </span>
          <span class="rv num" style="white-space:nowrap;">${fmtNum(top[0].production)}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ---- Diplomacy ---- */
function diplomacyRows(){
  const player = state.player.countryId;
  const q = (state.diploFilter||'').toLowerCase();
  const others = COUNTRIES_DATA.filter(c=>c.id!==player && c.name.toLowerCase().includes(q));
  if(!others.length) return '<tr><td colspan="4" class="empty">Aucun pays trouvé.</td></tr>';
  return others.map(o=>{
    const rel = getRelation(player,o.id);
    const pers = personalityOf(state.countries[o.id]||{});
    return `<tr>
      <td>${flagEmoji(o.iso2)} ${escapeHtml(o.name)}<br><span style="font-size:11px;color:var(--muted-2);">${escapeHtml(pers.label)}</span></td>
      <td>${statusPill(rel.status)}</td>
      <td class="num">${Math.round(rel.score)}/100</td>
      <td><div class="btn-row" style="margin:0;">
        ${DIPLO_ACTIONS.map(a=>`<button class="btn sm" onclick="diploAction('${o.id}','${a.id}')">${a.label}</button>`).join('')}
      </div></td>
    </tr>`;
  }).join('');
}
function renderDiplomacy(){
  return `
  <h1>Diplomatie</h1>
  <div class="subtitle">Relations avec les ${COUNTRIES_DATA.length-1} autres nations du monde.</div>
  <div class="search"><input type="text" id="diploSearch" placeholder="Rechercher un pays…" value="${escapeHtml(state.diploFilter||'')}" oninput="setDiploFilter(this.value)"></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Pays</th><th>Statut</th><th>Score</th><th>Actions</th></tr></thead>
    <tbody id="diploTbody">${diplomacyRows()}</tbody>
  </table></div>
  ${(()=>{
    const orgs = playerOrgs();

    return `<div class="card" style="margin-top:14px;">
      <h3>Organisations internationales</h3>
      <p class="hint" style="margin-top:-4px;">Vous siégez dans ${orgs.length} organisation(s). Une résolution est adoptée si la majorité des membres vote pour — chacun vote selon ses relations avec la cible, avec vous, et selon son caractère.</p>
      ${orgs.map(o=>`<div class="row"><span class="rl">${escapeHtml(o.name)}</span><span class="rv num">${orgMembers(o).length} membres</span></div>`).join('')}
      <div class="field" style="margin-top:10px;"><label>Pays visé par la résolution</label>
        <select onchange="setResolutionTarget(this.value)">
          <option value="">— Choisir un pays —</option>
          ${COUNTRIES_DATA.filter(x=>x.id!==state.player.countryId).map(x=>`<option value="${x.id}" ${target===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}
        </select>
      </div>
      ${orgs.map(o=>`
        <div style="font-size:11px;color:var(--muted-2);margin-top:8px;">${escapeHtml(o.name)}</div>
        <div class="btn-row" style="margin-top:4px;">
          ${RESOLUTION_TYPES.map(t=>{
            const v = target ? resolutionVote(o, target, t.key) : null;
            return `<button class="btn sm" ${target?'':'disabled'} onclick="proposeResolution('${o.key}','${t.key}')" title="${v?('Vote estimé : '+v.yes+' pour / '+v.no+' contre'):'Choisissez un pays'}">${t.label}${v?` (${v.yes}/${v.total})`:''}</button>`;
          }).join('')}
        </div>`).join('')}
      ${recent.length?`<div class="row" style="margin-top:10px;"><span class="rl" style="color:var(--parchment)">Résolutions récentes</span><span></span></div>
      ${recent.map(r=>`<div class="row"><span class="rl">${escapeHtml(r.type)} — ${escapeHtml(countryName(r.target))}<br><span style="font-size:11px;color:var(--muted-2);">${escapeHtml(r.org)}</span></span><span class="rv"><span class="pill ${r.passed?'good':'bad'}">${r.passed?'adoptée':'rejetée'} ${r.yes}/${r.no}</span></span></div>`).join('')}`:''}
    </div>`;
  })()}`;
}

/* ---- Confédérations ---- */
function renderConfederations(){
  const conf = playerConfederation();
  const others = COUNTRIES_DATA.filter(c=>c.id!==state.player.countryId);
  if(!conf){
    const sorted = others.slice().sort((a,b)=>a.name.localeCompare(b.name));
    return `
    <h1>Confédérations</h1>
    <div class="subtitle">Formez une union monétaire avec d'autres pays, à la manière de l'Union européenne : monnaie commune, inflation partagée, relations renforcées.</div>
    <div class="card">
      <h3>Fonder une confédération</h3>

      <div class="field"><label>Pays partenaire (score relationnel ≥ ${CONFEDERATION_MIN_SCORE} requis)</label>
        <select id="confPartner">${sorted.map(o=>`<option value="${o.id}">${flagEmoji(o.iso2)} ${escapeHtml(o.name)} — score ${Math.round(getRelation(state.player.countryId,o.id).score)}${state.countries[o.id].confederationId?' (déjà affilié)':''}</option>`).join('')}</select>
      </div>
      <div class="btn-row"><button class="btn primary" onclick="createConfederation(document.getElementById('confName').value, document.getElementById('confCurrency').value, document.getElementById('confPartner').value)">Fonder la confédération</button></div>
    </div>`;
  }
  const memberRows = conf.members.map(id=>{
    const c = state.countries[id];
    return `<div class="row"><span class="rl">${flagEmoji(c.iso2)} ${escapeHtml(c.name)}</span><span class="rv num">Inflation ${fmtPct(c.economy.inflation)}</span></div>`;
  }).join('');
  const candidates = others.filter(o=>!conf.members.includes(o.id)).sort((a,b)=>a.name.localeCompare(b.name));
  return `
  <h1>Confédérations</h1>
  <div class="subtitle">Membre de « ${escapeHtml(conf.name)} » depuis ${turnDateLabel(conf.founded)} · Monnaie commune : ${escapeHtml(conf.currency)}</div>
  <div class="grid cols2">
    <div class="card">
      <h3>Pays membres (${conf.members.length})</h3>
      ${memberRows}
      <p class="hint" style="margin-top:10px;">L'inflation des membres converge progressivement, et la croissance bénéficie d'un léger bonus lié au marché commun.</p>
      <div class="btn-row"><button class="btn danger sm" onclick="leaveConfederation()">Quitter la confédération</button></div>
    </div>
    <div class="card">
      <h3>Inviter un pays</h3>
      ${candidates.length ? `
      <div class="field"><label>Pays (score ≥ ${CONFEDERATION_MIN_SCORE} requis)</label>
        <select id="confInvite">${candidates.map(o=>`<option value="${o.id}">${flagEmoji(o.iso2)} ${escapeHtml(o.name)} — score ${Math.round(getRelation(state.player.countryId,o.id).score)}${state.countries[o.id].confederationId?' (déjà affilié)':''}</option>`).join('')}</select>
      </div>
      <div class="btn-row"><button class="btn" onclick="inviteToConfederation(document.getElementById('confInvite').value)">Inviter</button></div>
      ` : '<div class="empty">Tous les pays disponibles appartiennent déjà à une confédération.</div>'}
    </div>
  </div>`;
}

/* ---- Sport ---- */
function sportRanking(){
  return COUNTRIES_DATA.map(base=>{
    const c = state.countries[base.id];
    const d = c.sport.disciplines;
    return { id: c.id, avg: (d.football+d.athletisme+d.basketball+d.natation)/4 };
  }).sort((a,b)=>b.avg-a.avg);
}
function renderSport(){

function renderIntelligence(c){
  const intel = c.intelligence || {capability:30, counterIntel:30, sabotage:null};
  const target = state.intelTarget || '';
  const targetCountry = target ? state.countries[target] : null;
  const reports = Object.keys(state.espionageReports||{})
    .map(id=>({id, ...state.espionageReports[id]}))
    .sort((a,b)=>b.turn-a.turn);
  return `
  <div class="card" style="margin-top:14px;">
    <h3>Services de renseignement</h3>
    <p class="hint" style="margin-top:-4px;">Le budget Renseignement (onglet Économie) détermine votre capacité offensive et votre contre-espionnage.</p>
    <div class="grid cols2" style="margin-top:6px;">
      <div class="row"><span class="rl">Capacité offensive</span><span class="rv"><span class="pill ${intel.capability>=60?'good':(intel.capability>=35?'warn':'bad')}">${round1(intel.capability)}/100</span></span></div>
      <div class="row"><span class="rl">Contre-espionnage</span><span class="rv"><span class="pill ${intel.counterIntel>=60?'good':(intel.counterIntel>=35?'warn':'bad')}">${round1(intel.counterIntel)}/100</span></span></div>
    </div>
    ${intel.sabotage && intel.sabotage.turnsLeft>0 ? `<div class="row" style="margin-top:6px;"><span class="rl">Sabotage subi</span><span class="rv"><span class="pill bad">${escapeHtml((SABOTAGE_KINDS.find(k=>k.key===intel.sabotage.kind)||{}).label||intel.sabotage.kind)} — ${intel.sabotage.turnsLeft} mois restants</span></span></div>` : ''}
    <div class="field" style="margin-top:10px;"><label>Pays visé</label>
      <select onchange="setIntelTarget(this.value)">
        <option value="">— Choisir un pays —</option>
        ${COUNTRIES_DATA.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}" ${target===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}
      </select>
    </div>
    ${targetCountry ? `<p class="hint">Chances de succès estimées : <b style="color:var(--parchment)">${round1(espionageOdds(c, targetCountry))} %</b> (contre-espionnage adverse : ${round1((targetCountry.intelligence&&targetCountry.intelligence.counterIntel!=null)?targetCountry.intelligence.counterIntel:30)}/100).</p>` : ''}
    <div class="btn-row" style="flex-wrap:wrap;gap:6px;">
      <button class="btn sm" ${target?'':'disabled'} onclick="spyOnCountry('${target}')">Espionner (${fmtMoney(Math.max(c.gdp*1e9*0.0004,3e6))})</button>
      ${SABOTAGE_KINDS.map(k=>`<button class="btn sm" ${target?'':'disabled'} onclick="sabotageOperation('${target}','${k.key}')" title="${escapeHtml(k.desc)}">${k.label} (${fmtMoney(Math.max(c.gdp*1e9*0.0012,8e6))})</button>`).join('')}
    </div>
    <p class="hint" style="margin-top:6px;">Un échec dégrade fortement la relation avec la cible — un sabotage raté peut virer à l'incident diplomatique.</p>
    ${reports.length?`<div class="row" style="margin-top:10px;"><span class="rl" style="color:var(--parchment)">Rapports d'espionnage</span><span></span></div>
    ${reports.map(r=>`<div class="row" style="align-items:flex-start;">
      <span class="rl">${flagEmoji((COUNTRY_INDEX[r.id]||{}).iso2||'')} ${escapeHtml(countryName(r.id))}<br>
        <span style="font-size:11px;color:var(--muted-2);">Obtenu il y a ${state.player.turn-r.turn} mois — ${escapeHtml(r.regime)}</span></span>
      <span style="text-align:right;font-size:12px;">
        PIB ${fmtMoney(r.gdp*1e9)} · croissance ${round1(r.growth)} %<br>
        Troupes ${fmtNum(r.troops)} · armement ${round1(r.arms)} %<br>
        Dette ${fmtMoney(r.debt)} · ressources ${fmtMoney(r.resourceRevenue)}/mois
      </span>
    </div>`).join('')}` : `<p class="hint" style="margin-top:8px;">Aucun rapport pour l'instant : lancez une opération d'espionnage.</p>`}
  </div>`;
}

/* ---- Infrastructure ---- */
function renderInfra(){
  const c = playerState();
  return `
  <h1>Infrastructures</h1>
  <div class="subtitle">${c.cities.length} ville${c.cities.length>1?'s':''} suivie${c.cities.length>1?'s':''}${c.id===DRC_ID?' — cartographie détaillée de la RD Congo':''}.</div>
  <div class="grid cols2">
    ${c.cities.map(city=>`
      <div class="city-card">
        <h4>${escapeHtml(city.name)} ${city.isCapital?'<span class="pill info">Capitale</span>':''}</h4>
        <div class="row"><span class="rl">Population</span><span class="rv num">${fmtNum(city.population)}</span></div>
        <div class="infra-grid" style="margin-top:8px;">
          <div class="ig"><span>Routes</span><b class="num">${city.infra.roads||0}/100</b></div>
          ${INFRA_TYPES.filter(t=>!t.capped).map(t=>`<div class="ig"><span>${escapeHtml(t.label)}</span><b class="num">${(city.infra[t.key])||0}${t.requiresCoastal&&!city.coastal?' (n/d)':''}</b></div>`).join('')}
        </div>
        ${INFRA_GROUPS.map(g=>`
          <div style="font-size:11px;color:var(--muted-2);margin-top:8px;">${g}</div>
          <div class="btn-row" style="margin-top:4px;">
            ${INFRA_TYPES.filter(t=>t.group===g).map(t=>{
              const blocked = (t.requiresCoastal&&!city.coastal) || (t.minCityPop&&city.population<t.minCityPop);
              const why = t.requiresCoastal&&!city.coastal ? 'Accès maritime requis'
                        : (t.minCityPop&&city.population<t.minCityPop ? `${fmtNum(t.minCityPop)} habitants requis` : fmtMoney(infraCost(t,c)));
              return `<button class="btn sm" ${blocked?'disabled':''} onclick="buildInfra('${city.id}','${t.key}')" title="${escapeHtml(why)}">+ ${t.label} (${fmtMoney(infraCost(t,c))})</button>`;
            }).join('')}
          </div>`).join('')}
      </div>`).join('')}
  </div>
  ${(()=>{
    const fx = infraEffects(c);
    const t = fx.totals;
    return `<div class="card" style="margin-top:14px;">
      <h3>Couverture nationale &amp; effets</h3>
      <div class="grid cols2">
        ${INFRA_TYPES.map(x=>`<div class="row"><span class="rl">${escapeHtml(x.label)}</span><span class="rv num">${x.capped?round1((c.cities.length?t[x.key]/c.cities.length:0))+'/100 (moy.)':fmtNum(t[x.key])}</span></div>`).join('')}
      </div>
      <div class="row" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px;"><span class="rl">Effet sur la croissance</span><span class="rv num pos">+${round1(fx.growth+fx.trade*0.35)} pts/mois</span></div>
      <div class="row"><span class="rl">Effet sur la santé</span><span class="rv num pos">+${round1(fx.health)} pts/mois</span></div>
      <div class="row"><span class="rl">Effet sur l'éducation</span><span class="rv num pos">+${round1(fx.education)} pts/mois</span></div>
      <div class="row"><span class="rl">Effet sur la popularité (logement + métro)</span><span class="rv num pos">+${round1(fx.housing+fx.metroBonus)} pts/mois</span></div>
      <p class="hint" style="margin-top:8px;">Routes, autoroutes, rails, ponts et métros portent la croissance ; ports et aéroports le commerce ; hôpitaux la santé ; écoles et universités l'éducation ; les logements font reculer la pauvreté. Chaque équipement construit coûte aussi de l'entretien chaque mois.</p>
    </div>`;
  })()}`;
}

/* ---- Government ---- */
function renderGovernment(){
  const c = playerState();
  return `
  <h1>Gouvernement &amp; Institutions</h1>
  <div class="grid cols2">
    <div class="card">
      <h3>Régime politique</h3>
      <div class="field"><label>Forme du régime</label>
        <select onchange="setRegime(this.value)">
          ${REGIMES.map(r=>`<option ${c.regime===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
      <p class="hint" style="margin-top:-6px;">${escapeHtml(REGIME_DESC[c.regime]||'')}</p>
      <div class="field"><label>Capitale</label>
        <select onchange="setCapital(this.value)">
          ${c.cities.map(ci=>`<option value="${ci.id}" ${c.capitalCityId===ci.id?'selected':''}>${escapeHtml(ci.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="card">
      <h3>Hymne national</h3>
      <div class="field"><label>Nom</label><input type="text" id="anthemName" value="${escapeHtml(c.anthem.name)}"></div>
      <div class="field"><label>Description</label><textarea id="anthemDesc">${escapeHtml(c.anthem.desc)}</textarea></div>
      <div class="btn-row"><button class="btn" onclick="setAnthem(document.getElementById('anthemName').value, document.getElementById('anthemDesc').value)">Adopter cet hymne</button></div>
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <h3>Cabinet ministériel</h3>
    <p class="hint" style="margin-top:-4px;">Chaque poste pourvu améliore réellement le secteur qu'il dirige (économie, sécurité, santé, éducation, défense, diplomatie) ; un poste vacant le pénalise légèrement.</p>
    <div class="row"><span class="rl">Postes pourvus</span><span class="rv"><span class="pill ${cabinetBonus(c).filledCount>=6?'good':(cabinetBonus(c).filledCount>=3?'warn':'bad')}">${cabinetBonus(c).filledCount} / ${MINISTRIES.length}</span></span></div>
    <div class="grid cols2" style="margin-top:8px;">
      <div class="field"><label>Premier ministre</label><input type="text" id="pmInput" value="${escapeHtml(c.government.pm)}"></div>
      ${MINISTRIES.map(m=>`<div class="field"><label>${m.label}</label><input type="text" id="min_${m.key}" value="${escapeHtml(c.government.ministers[m.key])}"></div>`).join('')}
    </div>
    <div class="btn-row"><button class="btn primary" onclick="submitCabinet()">Nommer le gouvernement</button></div>
  </div>
  <div class="card" style="margin-top:14px;">
    <h3>Décrets présidentiels</h3>
    <p class="hint" style="margin-top:-4px;">Des actions immédiates, sans passer par le Parlement — chacune a un vrai coût et un délai avant de pouvoir être réutilisée.</p>
    <div class="grid cols2" style="margin-top:6px;">
      ${DECREES.map(d=>{
        const left = decreeCooldownLeft(c, d.key);
        return `<div class="row" style="align-items:flex-start;">
          <span class="rl">${escapeHtml(d.label)}<br><span style="font-size:11px;color:var(--muted-2);">${escapeHtml(d.desc)}</span></span>
          <span style="text-align:right;white-space:nowrap;">
            ${left>0 ? `<span class="pill neutral">${left} mois</span>` : `<button class="btn sm" onclick="issueDecree('${d.key}')">Décréter</button>`}
          </span>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="card" style="margin-top:14px;">
    <h3>Médias</h3>
    ${(()=>{
      const mc = mediaClimate(c);
      return `
      <p class="hint" style="margin-top:-4px;">Financer la télévision publique rend la couverture plus favorable ; une presse libre amplifie tout, en bien comme en mal, et sort les affaires.</p>
      <div class="grid cols2" style="margin-top:6px;">
        ${numberField('Financement des médias publics', mc.funding, 'setMediaFunding(this.value)', '%')}
        ${numberField('Liberté de la presse', mc.freedom, 'setPressFreedom(this.value)', '%')}
      </div>
      <div class="row"><span class="rl">Couverture médiatique du gouvernement</span><span class="rv"><span class="pill ${mc.favorability>=60?'good':(mc.favorability>=45?'warn':'bad')}">${mc.favorability}/100</span></span></div>
      <div class="row"><span class="rl">Amplification de l'actualité</span><span class="rv num">×${round1(mc.amplification)}</span></div>
      <div class="row"><span class="rl">Risque qu'une affaire devienne virale</span><span class="rv"><span class="pill ${mc.scandalRisk<0.15?'good':(mc.scandalRisk<0.3?'warn':'bad')}">${Math.round(mc.scandalRisk*100)} %</span></span></div>
      <div class="row" style="margin-top:8px;"><span class="rl" style="color:var(--parchment)">Paysage médiatique</span><span></span></div>
      ${MEDIA_OUTLETS.map(o=>`<div class="row"><span class="rl">${escapeHtml(o.label)}${o.stateAligned?' <span class="pill info">publique</span>':''}<span class="bar" style="margin-top:5px;"><i style="width:${o.reach}%"></i></span></span><span class="rv num">${o.reach} % d'audience</span></div>`).join('')}
      <p class="hint" style="margin-top:8px;">Museler la presse fait aussi reculer les libertés publiques mois après mois — et les groupes qui y tiennent le remarquent.</p>`;
    })()}
  </div>
  ${renderPresidencyReport()}`;
}
function renderPresidencyReport(){
  const c = playerState();
  const rep = presidencyReport();
  if(!rep) return '';
  const hist = (state.history||[]);
  const sign = v => (v>0?'+':'')+v;
  return `
  <div class="card" style="margin-top:14px;">
    <h3>Bilan de votre présidence</h3>
    <div class="subtitle" style="margin-top:-2px;">${escapeHtml(headOfStateTitle(c))} de ${escapeHtml(c.name)} · ${turnDateLabel(state.player.turn)} · mandat n°${c.mandate.term}</div>
    <div class="grid cols2" style="margin-top:8px;">
      ${rep.metrics.map(m=>`<div class="row"><span class="rl">${escapeHtml(m.label)}</span><span class="rv num ${m.value*m.good>0?'pos':(m.value*m.good<0?'neg':'')}">${sign(m.value)}${m.unit}</span></div>`).join('')}
      <div class="row"><span class="rl">Popularité actuelle</span><span class="rv num">${rep.approval} %</span></div>
    </div>
    <p class="hint" style="margin-top:10px;line-height:1.6;color:var(--parchment);">${escapeHtml(presidencyNarrative(rep))}</p>
    ${hist.length ? `
      <h3 style="margin-top:14px;">Chronologie année par année</h3>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead><tr>
            <th style="text-align:left;padding:6px 8px;">Année</th>
            <th style="text-align:right;padding:6px 8px;">PIB</th>
            <th style="text-align:right;padding:6px 8px;">Popularité</th>
            <th style="text-align:right;padding:6px 8px;">Chômage</th>
            <th style="text-align:right;padding:6px 8px;">Pauvreté</th>
            <th style="text-align:right;padding:6px 8px;">Dette/PIB</th>
          </tr></thead>
          <tbody>
            ${hist.slice(-15).map(h=>`<tr>
              <td style="padding:5px 8px;">An ${h.year}</td>
              <td style="text-align:right;padding:5px 8px;" class="num">${fmtMoney(h.gdp*1e9)}</td>
              <td style="text-align:right;padding:5px 8px;" class="num">${h.approval} %</td>
              <td style="text-align:right;padding:5px 8px;" class="num">${h.unemployment} %</td>
              <td style="text-align:right;padding:5px 8px;" class="num">${h.poverty!=null?h.poverty+' %':'—'}</td>
              <td style="text-align:right;padding:5px 8px;" class="num">${h.debtRatio} %</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>` : '<p class="hint" style="margin-top:10px;">La chronologie s\'enrichit d\'une ligne à chaque année écoulée.</p>'}
  </div>`;
}
function submitCabinet(){
  const pm = document.getElementById('pmInput').value;
  const ministers = {};
  MINISTRIES.forEach(m=> ministers[m.key] = document.getElementById('min_'+m.key).value);
  setCabinet(pm, ministers);
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  if(loadGame()){ render(); }
  else { state = { screen: 'select' }; render(); }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
}
boot();

</script>
