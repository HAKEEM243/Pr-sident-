function cityById(c,id){ return c.cities.find(x=>x.id===id) || c.cities[0]; }

/* ============================================================
   SIMULATION ENGINE
   ============================================================ */
function avgRelationScore(id){
  const keys = Object.keys(state.relations).filter(k=>k.split('|').includes(id));
  if(!keys.length) return 50;
  return keys.reduce((a,k)=>a+state.relations[k].score,0)/keys.length;
}
/* ============================================================
   BUDGET DÉTAILLÉ — recettes et dépenses ligne par ligne
   Les chiffres affichés au joueur sont exactement ceux qui pilotent la
   simulation : aucune recette ni dépense n'est décorative.
   ============================================================ */
const REVENUE_LINES = [
  {key:'impotRevenu',   label:'Impôt sur le revenu',    rate:'taxIncome',    w:0.110},
  {key:'tva',           label:'TVA',                    rate:'taxVat',       w:0.085},
  {key:'impotSocietes', label:'Impôt sur les sociétés', rate:'taxCorporate', w:0.060},
  {key:'douanes',       label:'Droits de douane',       rate:'taxCustoms',   w:0.020},
];
const EXPENSE_LINES = [
  {key:'sante',          label:'Santé',            w:0.042, salaried:true},
  {key:'education',      label:'Éducation',        w:0.038, salaried:true},
  {key:'defense',        label:'Armée',            w:0.030, salaried:true},
  {key:'police',         label:'Police',           w:0.020, salaried:true},
  {key:'justice',        label:'Justice',          w:0.012, salaried:true},
  {key:'social',         label:'Aides sociales',   w:0.032, salaried:false},
  {key:'retraites',      label:'Retraites',        w:0.029, salaried:false},
  {key:'infra',          label:'Infrastructures',  w:0.028, salaried:false},
  {key:'recherche',      label:'Recherche',        w:0.011, salaried:true},
  {key:'administration', label:'Administration',   w:0.018, salaried:true},
  {key:'renseignement',  label:'Renseignement',    w:0.014, salaried:true},
];
function tourismFactor(c){
  const coastal = c.cities && c.cities.some(ci=>ci.coastal);
  const f = 0.006 + (coastal?0.004:0) + (c.social.healthIndex-50)/8000
          - c.police.crimeIndex/9000 + ((c.social.liberty!=null?c.social.liberty:60)-50)/12000;
  return clamp(f, 0.0005, 0.03);
}
function spendLevel(c, key){ const v = c.budget.spending[key]; return v!=null ? v : 50; }
function budgetBreakdown(c){
  const base = c.gdp*1e9/12;
  /* Une administration financée et peu corrompue collecte mieux l'impôt. */
  const collection = clamp(0.85 + (spendLevel(c,'administration')-50)/330 - ((c.social.corruption!=null?c.social.corruption:40)-40)/500, 0.5, 1.25);
  const revenues = REVENUE_LINES.map(l=>({
    key:l.key, label:l.label,
    amount: Math.max(0, base*l.w*((c.budget[l.rate]!=null?c.budget[l.rate]:0)/50)*collection),
  }));
  revenues.push({key:'ressources', label:'Ressources naturelles',
    amount: totalResourceRevenue(c)});
  revenues.push({key:'dividendes', label:'Dividendes des entreprises publiques',
    amount: c.companies.reduce((a,co)=> a + (co.ownership==='public' ? co.value*0.02 : 0), 0)});
  revenues.push({key:'tourisme', label:'Tourisme', amount: base*tourismFactor(c)});
  const salMult = 1 + (salaryPressure(c)-1)*0.45;
  const expenses = EXPENSE_LINES.map(l=>({
    key:l.key, label:l.label,
    amount: Math.max(0, base*l.w*(spendLevel(c,l.key)/50)*(l.salaried ? salMult : 1)),
  }));
  expenses.push({key:'infraMaint', label:'Entretien des infrastructures', amount: infraMaintenance(c)});
  const interest = Math.max(0,(c.budget.debt||0))*0.0025*creditRating(c).mult;
  expenses.push({key:'dette', label:'Intérêts de la dette (capitalisés)', amount: interest, capitalized:true});
  const totalRevenue = revenues.reduce((a,x)=>a+x.amount, 0);
  const totalExpense = expenses.reduce((a,x)=>a+(x.capitalized?0:x.amount), 0);
  return { revenues, expenses, totalRevenue, totalExpense, balance: totalRevenue-totalExpense, interest, collection };
}
/* Coût d'entretien mensuel d'un équipement : indexé sur la richesse du pays,
   sinon les grands pays pauvres seraient étranglés par leur propre réseau. */
function infraMaintUnitCost(c){
  const gpc = c.gdp*1e9/Math.max(1,c.population);
  return clamp(gpc*12, 20000, 400000);
}
function infraMaintenance(c){ return totalInfraCount(c)*infraMaintUnitCost(c); }
function totalInfraCount(c){
  return (c.cities||[]).reduce((a,city)=>{
    const inf = city.infra || {};
    let n = Math.round((inf.roads||0)/20);
    INFRA_TYPES.forEach(t=>{ if(!t.capped) n += (inf[t.key]||0); });
    return a + n;
  }, 0);
}
function discoverResource(c, rng){
  if(rng() < 0.5 && c.resources.length){
    const r = pick(rng, c.resources);
    r.reserves = Math.round((r.reserves||0) * rand(rng,1.15,1.4));
  } else {
    const existingTypes = c.resources.map(r=>r.type);
    const options = RESOURCE_POOL.filter(r=>!existingTypes.includes(r.type));
    if(options.length){
      const def = pick(rng, options);
      c.resources.push({ id: uid('res'), type: def.type, name: def.name, amount: randInt(rng,1000,6000), price: def.price, exploited:true });
    } else if(c.resources.length){
      const r = pick(rng, c.resources);
      r.reserves = Math.round((r.reserves||0) * 1.1);
    }
  }
}
function damageInfra(c, rng){
  const city = pick(rng, c.cities);
  city.infra.roads = clamp(city.infra.roads - randInt(rng,5,15), 0, 100);
}
function pushLog(msg, c){
  c = c || playerState();
  c.log.push({ msg, turn: state.player.turn });
  if(c.log.length > 60) c.log.shift();
}
const CREDIT_RATINGS = [
  {min:0, max:20, grade:'AAA', mult:0.85},
  {min:20, max:40, grade:'AA', mult:0.9},
  {min:40, max:60, grade:'A', mult:0.95},
  {min:60, max:80, grade:'BBB', mult:1.0},
  {min:80, max:100, grade:'BB', mult:1.1},
  {min:100, max:150, grade:'B', mult:1.25},
  {min:150, max:200, grade:'CCC', mult:1.5},
  {min:200, max:Infinity, grade:'D', mult:1.8},
];
function creditRating(c){
  const ratio = (c.budget.debt||0)/(c.gdp*1e9)*100;
  return CREDIT_RATINGS.find(r=>ratio>=r.min && ratio<r.max) || CREDIT_RATINGS[CREDIT_RATINGS.length-1];
}
function cabinetBonus(c){
  const m = c.government && c.government.ministers || {};
  const has = k => m[k] && m[k] !== 'Poste vacant';
  let growth=0, crime=0, health=0, education=0, approval=0, warDefense=0, filledCount=0;
  if(has('economie')){ growth+=0.05; filledCount++; } else growth-=0.04;
  if(has('interieur')){ crime-=0.5; filledCount++; } else crime+=0.4;
  if(has('sante')){ health+=0.35; filledCount++; } else health-=0.25;
  if(has('education')){ education+=0.35; filledCount++; } else education-=0.25;
  if(has('defense')){ warDefense+=0.25; filledCount++; } else warDefense-=0.15;
  if(has('affairesEtrangeres')){ approval+=0.06; filledCount++; } else approval-=0.04;
  return {growth, crime, health, education, approval, warDefense, filledCount};
}
function simulateCountry(c, isPlayer, turn){
  const rng = mulberry32((hashCode(c.id) ^ (turn*2654435761)) >>> 0);
  const avgTax = (c.budget.taxIncome + c.budget.taxCorporate)/2;
  const revenue = c.gdp*1e9/12*0.26*(avgTax/50);
  const sectors = EXPENSE_LINES.map(l=>l.key);
  const avgSpend = sectors.reduce((a,s)=>a+spendLevel(c,s),0)/sectors.length;
  const salPressure = isPlayer ? salaryPressure(c) : 1;
  const spending = c.gdp*1e9/12*0.26*(avgSpend/50) * (1 + (salPressure-1)*0.45);
  const resourceIncome = totalResourceRevenue(c);
  const companyIncome = c.companies.reduce((a,co)=> a + (co.ownership==='public' ? co.value*0.02 : 0), 0);
  const infraMaint = infraMaintenance(c);
  if(isPlayer){
    /* Le joueur est simulé sur le budget détaillé, ligne par ligne. */
    const bd = budgetBreakdown(c);
    const net = bd.balance;
    c.budget.lastRevenue = Math.round(bd.totalRevenue);
    c.budget.lastExpense = Math.round(bd.totalExpense);
    c.budget.lastBalance = Math.round(bd.balance);
    if(c.budget.treasury + net < 0){
      c.budget.debt = Math.max(0,(c.budget.debt||0)) + (-(c.budget.treasury+net));
      c.budget.treasury = 0;
    } else {
      c.budget.treasury += net;
      const payoff = Math.min(c.budget.treasury*0.15, c.budget.debt||0);
      c.budget.debt = Math.max(0,(c.budget.debt||0) - payoff);
      c.budget.treasury -= payoff;
    }
    c.budget.debt = Math.round(Math.max(0,(c.budget.debt||0)) * (1 + 0.0025*creditRating(c).mult));
    c.resources.forEach(r=>{
      const def = RESOURCE_POOL.find(d=>d.type===r.type);
      const basePrice = def ? def.price : r.price;
      r.prevPrice = r.price;
      const newPrice = Math.round(r.price*(1+rand(rng,-0.04,0.04)));
      r.price = Math.max(Math.round(basePrice*0.4), Math.min(Math.round(basePrice*2.2), newPrice));
      if(!r.exploited || (r.reserves||0)<=0) return;
      const extracted = resourceProduction(c, r);
      r.reserves = Math.max(0, (r.reserves||0) - extracted);
      if(r.reserves<=0){ r.exploited = false; pushLog(`Le gisement de ${r.name} est épuisé.`, c); }
    });
  }
  const regimeFx = REGIME_EFFECTS[c.regime] || REGIME_EFFECTS['République'];
  const cabFx = cabinetBonus(c);
  const monthlyGdp = c.gdp*1e9/12;
  const tradeIncome = resourceIncome + companyIncome;
  if(isPlayer) c.economy.tradeIncomeMonthly = round1(tradeIncome);
  /* Indice technologique : suit l'effort de recherche et le niveau d'éducation,
     et se répercute ensuite sur la croissance et la puissance militaire. */
  const techTarget = clamp((spendLevel(c,'recherche')-50)*0.6 + (c.social.educationIndex-50)*0.4 + 50, 0, 100);
  const techPrev = c.economy.techIndex!=null ? c.economy.techIndex : 40;
  c.economy.techIndex = round1(clamp(techPrev + clamp(techTarget-techPrev,-3,3)*0.12 + rand(rng,-0.2,0.2), 0, 100));
  let gd = 0;
  gd += (c.budget.spending.infra-50)/450;
  gd += (c.social.educationIndex-50)/900;
  gd += (avgRelationScore(c.id)-50)/1800;
  gd += regimeFx.growthBonus||0;
  gd += cabFx.growth;
  gd += (spendLevel(c,'recherche')-50)/600;
  gd += (c.economy.techIndex-50)/700;
  const infraFx = infraEffects(c);
  gd += infraFx.growth + infraFx.trade*0.35;
  gd += clamp(tradeIncome/monthlyGdp*3, -0.15, 0.4);
  if(c.intelligence && c.intelligence.sabotage && c.intelligence.sabotage.turnsLeft>0){
    const sb = c.intelligence.sabotage;
    if(sb.kind==='economie') gd -= sb.magnitude;
    if(sb.kind==='infrastructure') gd -= sb.magnitude*0.6;
  }
  gd += rand(rng,-1,1)*0.35;
  c.economy.growth = round1(clamp(c.economy.growth*0.85 + gd, -9, 13));
  c.gdp = Math.max(0.05, c.gdp * (1 + c.economy.growth/100/12));
  const training = c.social.jobTraining!=null ? c.social.jobTraining : 30;
  let ud = -c.economy.growth*0.06 - (c.budget.spending.social-50)/60 + rand(rng,-.4,.4) + (salPressure-1)*0.6;
  ud -= (training-30)/280;
  c.economy.unemployment = round1(clamp(c.economy.unemployment+ud, 1, 45));
  let idl = rand(rng,-.35,.35) + (c.budget.debt > c.gdp*1e9*0.6 ? 0.35 : 0) + (salPressure-1)*0.25;
  c.economy.inflation = round1(clamp(c.economy.inflation+idl, -2, 70));
  /* Le chômage des jeunes pèse plus lourd sur la criminalité que le taux global. */
  const youthUnemp = clamp(c.economy.unemployment*(2.4 - training/140 - (c.social.educationIndex-50)/300), 0, 95);
  let cd = -(c.budget.spending.police-50)*0.025 + (c.economy.unemployment-10)*0.045 + rand(rng,-.6,.6) + (regimeFx.crimeBonus||0)*0.03 + cabFx.crime + Math.max(0, youthUnemp-18)*0.012;
  c.police.crimeIndex = round1(clamp(c.police.crimeIndex+cd, 0, 100));
  const inmateChange = Math.round(c.population*0.000015*(c.police.crimeIndex/50));
  c.police.inmates = Math.max(0, Math.round((c.police.inmates||0) + inmateChange - (c.police.inmates||0)*0.02));
  if(c.police.inmates > (c.police.prisonCapacity||1)){
    c.police.crimeIndex = round1(clamp(c.police.crimeIndex + 0.25, 0, 100));
  }
  c.social.healthIndex = round1(clamp(c.social.healthIndex + ((c.budget.spending.sante-50)/40) + cabFx.health + infraFx.health + rand(rng,-.3,.3), 0, 100));
  c.social.educationIndex = round1(clamp(c.social.educationIndex + ((c.budget.spending.education-50)/40) + (spendLevel(c,'recherche')-50)/220 + cabFx.education + infraFx.education + rand(rng,-.3,.3), 0, 100));
  /* Justice, corruption, libertés : indicateurs vivants, pas décoratifs. */
  const jd = (spendLevel(c,'justice')-50)/55 + (c.social.educationIndex-50)/300 - (c.social.corruption!=null?(c.social.corruption-50):0)/220 + rand(rng,-.25,.25);
  c.police.justiceIndex = round1(clamp((c.police.justiceIndex!=null?c.police.justiceIndex:50) + jd, 0, 100));
  const corrD = -(c.police.justiceIndex-50)/240 - (c.social.educationIndex-50)/400 - (spendLevel(c,'administration')-50)/300 - (salPressure-1)*0.35 + rand(rng,-.22,.22);
  c.social.corruption = round1(clamp((c.social.corruption!=null?c.social.corruption:40) + corrD, 0, 100));
  const libTarget = regimeFx.liberty!=null ? regimeFx.liberty : 65;
  const relTarget = regimeFx.religiosity!=null ? regimeFx.religiosity : 45;
  c.social.liberty = round1(clamp((c.social.liberty!=null?c.social.liberty:60) + clamp(libTarget-(c.social.liberty!=null?c.social.liberty:60), -2, 2)*0.25, 0, 100));
  c.social.religiosity = round1(clamp((c.social.religiosity!=null?c.social.religiosity:45) + clamp(relTarget-(c.social.religiosity!=null?c.social.religiosity:45), -2, 2)*0.15, 0, 100));
  /* Brider la presse ronge les libertés publiques. */
  if(c.media) c.social.liberty = round1(clamp(c.social.liberty + ((c.media.pressFreedom!=null?c.media.pressFreedom:60)-60)*0.006, 0, 100));
  /* Renseignement : la capacité offensive et la contre-espionnage suivent le
     budget dédié, pour tous les pays (le joueur doit espionner des services
     réels, pas des chiffres figés). */
  if(c.intelligence){
    const intelSpend = spendLevel(c,'renseignement');
    c.intelligence.capability = round1(clamp((c.intelligence.capability!=null?c.intelligence.capability:30) + clamp(intelSpend-(c.intelligence.capability!=null?c.intelligence.capability:30),-3,3)*0.2 + rand(rng,-0.4,0.4), 0, 100));
    c.intelligence.counterIntel = round1(clamp((c.intelligence.counterIntel!=null?c.intelligence.counterIntel:30) + clamp(intelSpend*0.7-(c.intelligence.counterIntel!=null?c.intelligence.counterIntel:30),-3,3)*0.2 + rand(rng,-0.4,0.4), 0, 100));
    if(c.intelligence.sabotage && c.intelligence.sabotage.turnsLeft>0){
      c.intelligence.sabotage.turnsLeft--;
      if(c.intelligence.sabotage.turnsLeft<=0) c.intelligence.sabotage = null;
    }
  }
  let ad = 0;
  ad -= (c.economy.unemployment-10)*0.13;
  ad -= Math.max(0,c.economy.inflation-5)*0.09;
  ad += (c.social.healthIndex-50)*0.045;
  ad += (c.social.educationIndex-50)*0.045;
  ad -= (c.police.crimeIndex-30)*0.045;
  ad += c.economy.growth*0.28;
  ad += (c.budget.debt < c.gdp*1e9*0.4 ? 0.25 : -0.4);
  if((c.social.ageElderly||0)>15 && c.social.pensionLevel<40) ad -= ((c.social.ageElderly||0)-15)*0.03;
  ad += (spendLevel(c,'retraites')-50)*0.006*clamp((c.social.ageElderly||10)/12, 0.3, 2.5);
  /* Se loger et se déplacer compte autant que les grands indicateurs. */
  ad += infraFx.housing + infraFx.metroBonus;
  /* La couverture médiatique colore en permanence la perception de l'action. */
  const media = mediaClimate(c);
  ad += (media.favorability-50)*0.03;
  ad += cabFx.approval;
  /* La popularité converge vers l'opinion réelle des groupes sociaux. */
  if(isPlayer && c.demographics){
    const target = opinionApproval(c);
    if(target!=null && isFinite(target)) ad += (target - c.economy.approval)*0.18;
  }
  ad += rand(rng,-1.3,1.3)*media.amplification;
  ad *= regimeFx.approvalSwing!=null ? regimeFx.approvalSwing : 1;
  c.economy.approval = round1(clamp(c.economy.approval+ad, 0, regimeFx.approvalCeiling!=null ? regimeFx.approvalCeiling : 100));
  c.social.birthRate = round1(clamp((c.social.birthRate!=null?c.social.birthRate:20) - (c.social.educationIndex-50)/400 + rand(rng,-.15,.15), 6, 45));
  c.social.mortalityRate = round1(clamp((c.social.mortalityRate!=null?c.social.mortalityRate:10) - (c.social.healthIndex-50)/120 + rand(rng,-.15,.15), 2, 25));
  const naturalRate = (c.social.birthRate - c.social.mortalityRate)/1000/12;
  let arrivalRate = 0.0003;
  const workVisaEffect = Math.min(200,c.social.workVisaLevel||0)/100;
  arrivalRate += workVisaEffect*0.0007;
  if(c.social.refugeePolicy==='accueil') arrivalRate += 0.0004;
  /* La politique migratoire module l'ensemble du flux : fermer les frontières
     réduit aussi les visas de travail et l'accueil des réfugiés. */
  arrivalRate *= c.social.immigration==='ouverte' ? 1.9 : (c.social.immigration==='quotas' ? 1 : 0.25);
  let departureRate = 0.0002;
  if(c.economy.unemployment>20) departureRate += 0.0004;
  if(c.economy.approval<30) departureRate += 0.0003;
  if(c.social.immigration==='fermee') departureRate += 0.0002;
  const arrivals = Math.round(c.population*arrivalRate);
  const departures = Math.round(c.population*departureRate);
  const naturalChange = Math.round(c.population*naturalRate);
  /* Qui entre légalement, qui entre sans papiers, qui devient citoyen. */
  const monthlyQuota = c.social.immigration==='ouverte' ? Infinity
    : (c.social.immigration==='quotas' ? (c.social.visaQuota||0)/12
                                       : Math.max(0, (c.social.visaQuota||0)/12*0.15));
  const legalArrivals = isFinite(monthlyQuota) ? Math.min(arrivals, Math.round(monthlyQuota)) : arrivals;
  const illegalArrivals = Math.max(0, arrivals - legalArrivals);
  c.social.residents = Math.max(0, (c.social.residents||0) + legalArrivals);
  c.social.undocumented = Math.max(0, (c.social.undocumented||0) + illegalArrivals);
  const natRate = clamp(c.social.naturalizationRate!=null ? c.social.naturalizationRate : 3, 0, 100)/100/12;
  const naturalized = Math.min(c.social.residents, Math.round(c.social.residents*natRate));
  c.social.residents = Math.max(0, c.social.residents - naturalized);
  c.social.naturalizedTotal = Math.max(0, (c.social.naturalizedTotal||0) + naturalized);
  c.social.lastNaturalized = naturalized;
  c.social.lastLegalArrivals = legalArrivals;
  c.social.lastIllegalArrivals = illegalArrivals;
  /* Les résidents étrangers repartent plus souvent que la moyenne, mais en
     proportion de leur poids réel dans la population. */
  const residentShare = clamp((c.social.residents||0)/Math.max(1,c.population), 0, 1);
  const residentsLeaving = Math.min(c.social.residents, Math.round(departures*clamp(residentShare*2.5, 0, 0.6)));
  c.social.residents = Math.max(0, c.social.residents - residentsLeaving);
  /* Les sans-papiers ne s'accumulent pas indéfiniment : départs, retours et
     régularisations de droit commun en font sortir une part chaque mois. */
  c.social.undocumented = Math.max(0, Math.round((c.social.undocumented||0)*0.992));
  if(isPlayer && (arrivals>0 || departures>0)){
    const otherIds = Object.keys(state.countries).filter(id=>id!==c.id);
    if(otherIds.length){
      /* On retient d'où viennent les arrivants et où partent les partants. */
      const sample = pickN(rng, otherIds, Math.min(6, otherIds.length));
      const poorestFirst = sample.slice().sort((a,b)=>{
        const ga = state.countries[a], gb = state.countries[b];
        return (ga.gdp*1e9/Math.max(1,ga.population)) - (gb.gdp*1e9/Math.max(1,gb.population));
      });
      c.social.origins = c.social.origins || {};
      c.social.destinations = c.social.destinations || {};
      [0.5,0.3,0.2].forEach((share,i)=>{
        const src = poorestFirst[i];
        if(src && arrivals>0) c.social.origins[src] = (c.social.origins[src]||0) + Math.round(arrivals*share);
        const dst = poorestFirst[poorestFirst.length-1-i];
        if(dst && departures>0) c.social.destinations[dst] = (c.social.destinations[dst]||0) + Math.round(departures*share);
      });
    }
  }
  if(isPlayer){
    c.social.totalArrivals = (c.social.totalArrivals||0) + arrivals;
    c.social.totalDepartures = (c.social.totalDepartures||0) + departures;
    c.social.totalImmigrants = c.social.totalArrivals - c.social.totalDepartures;
    c.social.lastArrivals = arrivals;
    c.social.lastDepartures = departures;
    c.social.lastNetMigration = arrivals - departures;
    const visaProgramCost = c.gdp*1e9 * workVisaEffect * 0.00002;
    c.budget.treasury = Math.max(0, c.budget.treasury - visaProgramCost);
    if(workVisaEffect>0) c.economy.growth = round1(c.economy.growth + workVisaEffect*0.05);
  }
  c.population = Math.max(1000, c.population + naturalChange + arrivals - departures);
  /* Résidents et sans-papiers ne peuvent jamais dépasser la population réelle. */
  const foreignCap = Math.max(0, c.population - 1000);
  c.social.residents = Math.max(0, Math.min(c.social.residents||0, foreignCap));
  c.social.undocumented = Math.max(0, Math.min(c.social.undocumented||0, Math.max(0, foreignCap - c.social.residents)));
  c.social.ageYoung = round1(clamp((c.social.ageYoung!=null?c.social.ageYoung:25) + (c.social.birthRate-20)/2500, 10, 48));
  c.social.ageElderly = round1(clamp((c.social.ageElderly!=null?c.social.ageElderly:12) + (18-c.social.mortalityRate)/3500, 3, 30));
  c.social.lifeExpectancy = round1(clamp(50 + (c.social.healthIndex-50)/2 - (c.social.mortalityRate-10)*0.6, 40, 92));
  if(c.demographics){
    syncProfessions(c);
    driftClasses(c, salPressure, infraFx.housing);
    const g = c.demographics.generations;
    if(g){
      g.enfants = clamp((g.enfants||0) + (c.social.birthRate-20)/900, 5, 55);
      g.seniors = clamp((g.seniors||0) + (c.social.lifeExpectancy-65)/1400, 1, 35);
      normalizePct(g);
    }
  }
  if(isPlayer){
    if(c.social.popMilestoneIdx==null) c.social.popMilestoneIdx = POP_MILESTONES.filter(m=>m<=c.population).length;
    while(c.social.popMilestoneIdx < POP_MILESTONES.length && c.population >= POP_MILESTONES[c.social.popMilestoneIdx]){
      pushLog(`La population franchit le cap des ${fmtNum(POP_MILESTONES[c.social.popMilestoneIdx])} habitants.`, c);
      c.social.popMilestoneIdx++;
    }
  }
  /* Une affaire peut devenir virale : d'autant plus probable que le pays est
     corrompu et que la presse est libre de la sortir. */
  if(isPlayer && rng() < media.scandalRisk*0.05){
    const hit = rand(rng, 4, 11)*media.amplification;
    c.economy.approval = round1(clamp(c.economy.approval - hit, 0, 100));
    c.social.corruption = round1(clamp((c.social.corruption||40) + rand(rng,0.5,2), 0, 100));
    pushLog(`Une affaire éclate et devient virale : la popularité chute de ${round1(hit)} points.`, c);
    pushWorldNews(`Scandale d'État en ${c.name} : l'affaire fait le tour du monde.`);
  }
  /* Les sanctions internationales pèsent sur l'économie tant qu'elles durent. */
  if((c.sanctions||0) > 0){
    c.sanctions = Math.max(0, c.sanctions-1);
    c.economy.growth = round1(clamp(c.economy.growth - 0.25, -9, 13));
    c.budget.treasury = Math.max(0, c.budget.treasury - c.gdp*1e9*0.0008);
  }
  if(isPlayer && rng() < 0.22){
    const ev = pick(rng, EVENTS);
    ev.fx(c, rng);
    /* Les effets d'evenements sont appliques sans borne : on re-borne ici TOUT
       ce qu'un evenement peut toucher, sinon une valeur peut sortir de sa plage. */
    c.economy.approval = round1(clamp(c.economy.approval, 0, regimeFx.approvalCeiling!=null ? regimeFx.approvalCeiling : 100));
    c.economy.growth = round1(clamp(c.economy.growth, -9, 13));
    c.economy.inflation = round1(clamp(c.economy.inflation, -2, 70));
    c.economy.unemployment = round1(clamp(c.economy.unemployment, 1, 45));
    c.police.crimeIndex = round1(clamp(c.police.crimeIndex, 0, 100));
    c.police.justiceIndex = round1(clamp(c.police.justiceIndex!=null?c.police.justiceIndex:50, 0, 100));
    c.police.inmates = Math.max(0, Math.round(c.police.inmates||0));
    c.social.healthIndex = round1(clamp(c.social.healthIndex, 0, 100));
    c.social.educationIndex = round1(clamp(c.social.educationIndex, 0, 100));
    c.social.corruption = round1(clamp(c.social.corruption!=null?c.social.corruption:40, 0, 100));
    c.social.liberty = round1(clamp(c.social.liberty!=null?c.social.liberty:60, 0, 100));
    c.social.religiosity = round1(clamp(c.social.religiosity!=null?c.social.religiosity:45, 0, 100));
    c.budget.debt = Math.max(0, c.budget.debt||0);
    c.budget.treasury = Math.max(0, c.budget.treasury||0);
    c.gdp = Math.max(0.05, c.gdp);
    c.population = Math.max(1000, Math.round(c.population));
    pushLog(ev.msg(c), c);
  }
  if(isPlayer){
    c.mandate.turnsElapsed++;
    if(c.mandate.turnsElapsed >= c.mandate.length) runElection(c);
  }
}
function processContracts(){
  state.contracts = state.contracts.filter(ct=>{
    const involvesPlayer = ct.a === state.player.countryId || ct.b === state.player.countryId;
    if(involvesPlayer) playerState().budget.treasury += ct.income;
    ct.turnsLeft--;
    if(ct.turnsLeft <= 0){
      if(involvesPlayer) pushLog(`Le contrat avec ${countryName(ct.a===state.player.countryId?ct.b:ct.a)} est arrivé à son terme.`);
      return false;
    }
    return true;
  });
}
function militaryStrength(c){
  const tech = (c.economy && c.economy.techIndex!=null) ? c.economy.techIndex : 40;
  return c.military.troops * (0.4 + c.military.arms/100) * (0.85 + tech/400);
}
function techRanking(limit){
  const rows = [];
  for(const id in state.countries){
    const c = state.countries[id];
    if(c.economy && c.economy.techIndex!=null) rows.push({id, name:c.name, iso2:c.iso2, tech:c.economy.techIndex});
  }
  rows.sort((a,b)=>b.tech-a.tech);
  return limit ? rows.slice(0, limit) : rows;
}
function processWars(){
  const p = playerState();
  const rng = mulberry32((hashCode(p.id) ^ (state.player.turn*40503)) >>> 0);
  const warKeys = Object.keys(state.relations).filter(k=> state.relations[k].status==='guerre' && k.split('|').includes(p.id));
  warKeys.forEach(k=>{
    const otherId = k.split('|').find(id=>id!==p.id);
    const other = getCountryQuiet(otherId);
    if(!other) return;
    const defMult = clamp(1 - cabinetBonus(p).warDefense, 0.7, 1.3);
    p.military.troops = Math.max(0, Math.round(p.military.troops - p.military.troops*rand(rng,.006,.02)*defMult));
    p.budget.treasury = Math.max(0, p.budget.treasury - p.gdp*1e9*0.0015);
    p.economy.approval = clamp(p.economy.approval - rand(rng,.3,1), 0, 100);
    if(rng() < 0.1){
      const strength = militaryStrength(p), oppStrength = militaryStrength(other);
      if(strength > oppStrength*1.15){
        setRelation(p.id, otherId, {status:'paix', score:clamp(getRelation(p.id,otherId).score+20,0,100)});
        p.budget.treasury += p.gdp*1e9*0.01;
        p.economy.approval = clamp(p.economy.approval+6,0,100);
        pushLog(`Victoire militaire face à ${countryName(otherId)} : cessez-le-feu et réparations obtenues.`, p);
      } else if(oppStrength > strength*1.3){
        setRelation(p.id, otherId, {status:'paix', score:clamp(getRelation(p.id,otherId).score-10,0,100)});
        p.economy.approval = clamp(p.economy.approval-8,0,100);
        pushLog(`Défaite face à ${countryName(otherId)} : un cessez-le-feu est négocié dans la douleur.`, p);
      }
    }
  });
}
const ACHIEVEMENTS = [
  {id:'debt_free', label:'Zéro dette', desc:"Ramener la dette publique à 0.", check:c=> c.budget.debt<=0},
  {id:'full_employment', label:'Plein emploi', desc:'Chômage sous 5 %.', check:c=> c.economy.unemployment<5},
  {id:'beloved', label:"Plébiscité", desc:'Popularité au-dessus de 85 %.', check:c=> c.economy.approval>85},
  {id:'boom', label:'Miracle économique', desc:'Croissance du PIB au-dessus de 8 % sur un mois.', check:c=> c.economy.growth>8},
  {id:'peacekeeper', label:'Artisan de paix', desc:"10 relations en alliance ou accord commercial.", check:c=>{
    const keys = Object.keys(state.relations).filter(k=>k.split('|').includes(c.id) && ['alliance','accord commercial'].includes(state.relations[k].status));
    return keys.length>=10;
  }},
  {id:'infra_master', label:'Bâtisseur', desc:'Réseau routier à 90+ dans toutes les villes.', check:c=> c.cities.every(city=>city.infra.roads>=90)},
  {id:'safe_streets', label:'Rues sûres', desc:'Criminalité sous 10 %.', check:c=> c.police.crimeIndex<10},
  {id:'long_reign', label:'Longévité', desc:'Trois mandats accomplis.', check:c=> c.mandate.term>=3},
  {id:'currency_union', label:'Union monétaire', desc:'Fonder ou rejoindre une confédération.', check:c=> !!c.confederationId},
  {id:'olympian', label:'Nation sportive', desc:'Remporter une médaille internationale.', check:c=> c.sport.medals.or+c.sport.medals.argent+c.sport.medals.bronze>0},
];
function checkAchievements(){
  const p = playerState();
  state.achievements = state.achievements || [];
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievements.includes(a.id) && a.check(p)){
      state.achievements.push(a.id);
      pushLog(`Distinction obtenue : « ${a.label} ».`, p);
      toast(`🏅 Distinction débloquée : ${a.label}`);
    }
  });
}
function advanceTurn(skipRender){
  state.player.turn++;
  const p = playerState();
  simulateCountry(p, true, state.player.turn);
  Object.values(state.countries).forEach(c=>{ if(c.id!==p.id) simulateCountry(c,false,state.player.turn); });
  processContracts();
  processWars();
  processConfederations();
  processDiplomacyDrift();
  processForeignAI();
  processSport();
  refreshParliament();
  recordHistory();
  generateWorldNews();
  checkAchievements();
  saveGame();
  if(!skipRender) render();
}
/* Vitesse de simulation : ×1, ×2, ×5, ×10 mois d'un coup. */
function advanceTurns(n){
  const count = clamp(Math.round(n)||1, 1, 52);
  for(let i=0;i<count;i++) advanceTurn(true);
  render();
  if(count>1) toast(`${count} mois simulés.`);
}
/* Élection de fin de mandat : votre popularité décide de votre sort. */
function runElection(c){
  const rng = mulberry32((hashCode(c.id) ^ (state.player.turn*104729)) >>> 0);
  const enabled = !state.parliament || state.parliament.electionsEnabled !== false;
  const score = round1(clamp(c.economy.approval + rand(rng,-6,6), 0, 100));
  const won = !enabled || score >= 42;
  c.mandate.turnsElapsed = 0;
  state.lastElection = { turn: state.player.turn, score, won, term: c.mandate.term, forced: !enabled };
  refreshParliament();
  if(won){
    c.mandate.term++;
    c.economy.approval = round1(clamp(c.economy.approval + (score>=60?4:2), 0, 100));
    pushLog(`Élection : vous êtes reconduit(e) à la tête du pays avec ${score} % des suffrages.`, c);
    pushWorldNews(`${c.name} : le chef de l'État est reconduit avec ${score} % des voix.`);
  } else {
    state.defeated = true;
    pushLog(`Élection : vous êtes battu(e) avec ${score} % des suffrages.`, c);
    pushWorldNews(`${c.name} : alternance politique, le chef de l'État sortant est battu.`);
  }
}
function continueAfterDefeat(){
  state.defeated = false;
  if(state.parliament) state.parliament.electionsEnabled = false;
  const c = playerState();
  c.mandate.term++;
  pushLog('Vous poursuivez la partie en mode bac à sable : les élections sont désactivées.', c);
  saveGame(); render();
}
function setElectionsEnabled(on){
  if(!state.parliament) return;
  state.parliament.electionsEnabled = !!on;
  saveGame(); render();
}
function setPresidentialParty(key){
  if(!state.parliament) return;
  state.parliament.presidentialParty = key;
  state.parliament.coalition = (state.parliament.coalition||[]).filter(k=>k!==key);
  refreshParliament();
  saveGame(); render();
}
function toggleCoalition(key){
  const pl = state.parliament;
  if(!pl || key===pl.presidentialParty) return;
  pl.coalition = pl.coalition||[];
  const i = pl.coalition.indexOf(key);
  if(i>=0) pl.coalition.splice(i,1); else pl.coalition.push(key);
  saveGame(); render();
}
function proposeLaw(key){
  const law = LAWS.find(l=>l.key===key);
  const pl = state.parliament;
  if(!law || !pl) return;
  const c = playerState();
  if((pl.passedLaws||[]).indexOf(key)>=0){ toast('Cette loi a déjà été adoptée.'); return; }
  const v = lawVote(law);
  pl.lastVote = { key, label: law.label, yes: v.yes, no: v.no, passed: v.passed, turn: state.player.turn };
  if(v.passed){
    try{ law.fx(c); }catch(e){}
    pl.passedLaws = (pl.passedLaws||[]).concat([key]);
    c.economy.approval = round1(clamp(c.economy.approval+1.5, 0, 100));
    pushLog(`Le Parlement adopte « ${law.label} » par ${v.yes} voix contre ${v.no}.`, c);
    toast('Loi adoptée par le Parlement.');
  } else {
    c.economy.approval = round1(clamp(c.economy.approval-1, 0, 100));
    pushLog(`Le Parlement rejette « ${law.label} » (${v.yes} pour, ${v.no} contre).`, c);
    toast('Loi rejetée par le Parlement.');
  }
  refreshParliament();
  saveGame(); render();
}
/* Bilan chiffré de la présidence, comparé au pays dont vous avez hérité. */
function presidencyReport(){
  const c = playerState();
  const b = state.baseline || (state.history && state.history[0]) || null;
  if(!b) return null;
  const d = c.demographics;
  const poverty = d ? round1((d.classes.tresPauvres||0)+(d.classes.pauvres||0)) : null;
  const pct = (now, then)=> (then>0 ? round1((now-then)/then*100) : 0);
  const metrics = [
    {label:'Croissance économique (PIB)', value: pct(c.gdp, b.gdp), unit:' %', good:1,
     pos:"le redressement de l'économie", neg:"le recul de l'économie"},
    {label:'Pauvreté', value: (poverty!=null && b.poverty!=null) ? round1(poverty-b.poverty) : 0, unit:' pts', good:-1,
     pos:'la montée de la pauvreté', neg:'le recul de la pauvreté'},
    {label:'Chômage', value: round1(c.economy.unemployment-b.unemployment), unit:' pts', good:-1,
     pos:'la hausse du chômage', neg:'la baisse du chômage'},
    {label:'Dette (part du PIB)', value: round1(c.budget.debt/(c.gdp*1e9)*100 - b.debtRatio), unit:' pts', good:-1,
     pos:'une forte hausse de la dette publique', neg:'un assainissement des finances publiques'},
    {label:'Espérance de vie', value: round1(c.social.lifeExpectancy-b.lifeExpectancy), unit:' ans', good:1,
     pos:"l'allongement de l'espérance de vie", neg:"la baisse de l'espérance de vie"},
    {label:'Population', value: pct(c.population, b.population), unit:' %', good:1,
     pos:'la croissance démographique du pays', neg:'le déclin démographique du pays'},
    {label:'Libertés publiques', value: round1((c.social.liberty||0)-(b.liberty||0)), unit:' pts', good:1,
     pos:"l'élargissement des libertés publiques", neg:'le recul des libertés publiques'},
    {label:'Corruption', value: round1((c.social.corruption||0)-(b.corruption||0)), unit:' pts', good:-1,
     pos:'la montée de la corruption', neg:'le recul de la corruption'},
    {label:'Puissance militaire', value: pct(Math.round(militaryStrength(c)), b.military), unit:' %', good:1,
     pos:"le renforcement de l'armée", neg:"l'affaiblissement de l'armée"},
  ].filter(m=>isFinite(m.value));
  return { metrics, approval: c.economy.approval };
}
function presidencyNarrative(rep){
  const c = playerState();
  const scored = rep.metrics.map(m=>({phrase: m.value>0?m.pos:m.neg, value:m.value, unit:m.unit, score:m.value*m.good}))
                            .filter(m=>isFinite(m.score) && m.phrase).sort((a,b)=>b.score-a.score);
  if(!scored.length) return '';
  const best = scored[0], worst = scored[scored.length-1];
  const sign = v => (v>0?'+':'')+v;
  let txt = 'Votre gouvernement restera principalement dans les mémoires pour ';
  txt += (best && best.score>0)
    ? `${best.phrase} (${sign(best.value)}${best.unit}).`
    : 'une gestion sans grand relief.';
  if(worst && worst.score<0 && worst.phrase!==best.phrase){
    txt += ` Votre mandat fut cependant marqué par ${worst.phrase} (${sign(worst.value)}${worst.unit}).`;
  }
  const a = c.economy.approval;
  txt += a>=60 ? " Vous gouvernez avec le soutien d'une large majorité."
       : (a>=40 ? " L'opinion reste partagée sur votre bilan."
                : ' Vous laissez un pays profondément divisé.');
  return txt;
}
/* Chronologie de la présidence : un instantané par année de mandat. */
function recordHistory(){
  if(!state.history) state.history = [];
  const turn = state.player.turn;
  if(turn % 12 !== 0) return;
  const c = playerState();
  const d = c.demographics;
  state.history.push({
    turn,
    year: Math.floor(turn/12),
    gdp: round1(c.gdp),
    approval: c.economy.approval,
    unemployment: c.economy.unemployment,
    poverty: d ? round1((d.classes.tresPauvres||0)+(d.classes.pauvres||0)) : null,
    debtRatio: round1(c.budget.debt/(c.gdp*1e9)*100),
    lifeExpectancy: c.social.lifeExpectancy,
    population: c.population,
    liberty: c.social.liberty,
    corruption: c.social.corruption,
    military: Math.round(militaryStrength(c)),
  });
  if(state.history.length > 200) state.history.shift();
}

/* ============================================================
   ACTIONS — Diplomacy
   ============================================================ */
function relKey(a,b){ return [a,b].sort().join('|'); }
function getRelation(a,b){ return state.relations[relKey(a,b)] || {score:50, status:'paix'}; }
function setRelation(a,b,patch){
  const k = relKey(a,b);
  state.relations[k] = Object.assign({score:50,status:'paix'}, state.relations[k], patch);
}
function addContract(a,b){
  const income = Math.round((getCountryQuiet(a).gdp + getCountryQuiet(b).gdp) * 1e9 * 0.00004);
  state.contracts.push({ id: uid('ct'), a, b, income, turnsLeft: randInt(mulberry32(randSeed()), 12, 30) });
}
function diploAction(otherId, action){
  const player = state.player.countryId;
  const rel = getRelation(player, otherId);
  let score = rel.score, status = rel.status;
  const oName = countryName(otherId);
  let msg = '';
  if(action==='alliance'){
    if(status==='guerre'){ msg = `Impossible de proposer une alliance : vous êtes en guerre avec ${oName}.`; }
    else if(score < 55){ msg = `${oName} refuse l'alliance : les relations sont trop tendues (score requis : 55).`; }
    else { status='alliance'; score=clamp(score+12,0,100); msg = `Alliance conclue avec ${oName}.`; }
  } else if(action==='commerce'){
    if(status==='guerre'){ msg = `Impossible de commercer avec un pays en guerre.`; }
    else { if(status==='paix') status='accord commercial'; score=clamp(score+6,0,100);
      addContract(player, otherId); msg = `Accord commercial signé avec ${oName}.`; }
  } else if(action==='aide'){
    const cost = playerState().gdp*1e9*0.003;
    if(playerState().budget.treasury < cost){ msg = `Trésor insuffisant pour envoyer une aide (${fmtMoney(cost)} nécessaires).`; }
    else { playerState().budget.treasury -= cost; score=clamp(score+15,0,100); msg = `Aide de ${fmtMoney(cost)} envoyée à ${oName}.`; }
  } else if(action==='sanctions'){
    status='sanctions'; score=clamp(score-15,0,100); msg = `Sanctions économiques imposées à ${oName}.`;
  } else if(action==='guerre'){
    status='guerre'; score=clamp(score-45,0,100); playerState().economy.approval=clamp(playerState().economy.approval-4,0,100);
    msg = `Déclaration de guerre à ${oName} !`;
    const cancelled = state.contracts.filter(ct=>(ct.a===player&&ct.b===otherId)||(ct.b===player&&ct.a===otherId));
    if(cancelled.length){
      state.contracts = state.contracts.filter(ct=>!cancelled.includes(ct));
      msg += ` Les contrats commerciaux avec ${oName} sont rompus.`;
    }
    const conf = playerConfederation();
    if(conf && conf.members.includes(otherId)){
      conf.members = conf.members.filter(id=>id!==otherId);
      getCountryQuiet(otherId).confederationId = null;
      msg += ` ${oName} est exclu de la confédération « ${conf.name} ».`;
      if(conf.members.length<2){
        conf.members.forEach(id=>{ const c=getCountryQuiet(id); if(c) c.confederationId=null; });
        state.confederations = state.confederations.filter(x=>x.id!==conf.id);
        msg += ` La confédération est dissoute.`;
      }
    }
  } else if(action==='paix'){
    status='paix'; score=clamp(score+8,0,100); msg = `Retour à la paix avec ${oName}.`;
  }
  setRelation(player, otherId, {score, status});
  pushLog(msg);
  checkAchievements();
  saveGame();
  refreshDiplomacyTable();
  refreshTicker();
  refreshMapIfActive();
}

function playerConfederation(){ return state.confederations.find(cf=>cf.members.includes(state.player.countryId)); }
function createConfederation(name, currency, partnerId){
  name = (name||'').trim(); currency = (currency||'').trim();
  if(!name || !currency){ toast('Donnez un nom et une monnaie à la confédération.'); return; }
  if(playerConfederation()){ toast('Vous appartenez déjà à une confédération : quittez-la d\'abord.'); return; }
  if(!partnerId){ toast('Choisissez un pays partenaire pour fonder la confédération.'); return; }
  const rel = getRelation(state.player.countryId, partnerId);
  if(rel.status==='guerre'){ toast('Impossible de fonder une confédération avec un pays en guerre.'); return; }
  if(rel.score<CONFEDERATION_MIN_SCORE){ toast(`${countryName(partnerId)} refuse : relations insuffisantes (score requis : ${CONFEDERATION_MIN_SCORE}).`); return; }
  if(getCountryQuiet(partnerId).confederationId){ toast(`${countryName(partnerId)} appartient déjà à une autre confédération.`); return; }
  const conf = { id: uid('conf'), name, currency, members: [state.player.countryId, partnerId], founded: state.player.turn };
  state.confederations.push(conf);
  playerState().confederationId = conf.id;
  getCountryQuiet(partnerId).confederationId = conf.id;
  setRelation(state.player.countryId, partnerId, {status:'alliance', score: clamp(rel.score+10,0,100)});
  pushLog(`Fondation de la confédération « ${name} » avec ${countryName(partnerId)}. Monnaie commune : ${currency}.`);
  checkAchievements();
  saveGame(); render();
}
function inviteToConfederation(countryId){
  const conf = playerConfederation();
  if(!conf){ toast('Vous ne faites partie d\'aucune confédération.'); return; }
  if(!countryId){ toast('Choisissez un pays à inviter.'); return; }
  if(conf.members.includes(countryId)){ toast('Ce pays est déjà membre.'); return; }
  if(getCountryQuiet(countryId).confederationId){ toast(`${countryName(countryId)} appartient déjà à une autre confédération.`); return; }
  const rel = getRelation(state.player.countryId, countryId);
  if(rel.status==='guerre'){ toast('Impossible d\'inviter un pays en guerre.'); return; }
  if(rel.score<CONFEDERATION_MIN_SCORE){ toast(`${countryName(countryId)} refuse l'invitation (score requis : ${CONFEDERATION_MIN_SCORE}).`); return; }
  conf.members.push(countryId);
  getCountryQuiet(countryId).confederationId = conf.id;
  setRelation(state.player.countryId, countryId, {status:'alliance', score: clamp(rel.score+10,0,100)});
  pushLog(`${countryName(countryId)} rejoint la confédération « ${conf.name} ».`);
  saveGame(); render();
}
function leaveConfederation(){
  const conf = playerConfederation();
  if(!conf) return;
  if(!confirm(`Quitter la confédération « ${conf.name} » ?`)) return;
  conf.members = conf.members.filter(id=>id!==state.player.countryId);
  playerState().confederationId = null;
  if(conf.members.length<2){
    conf.members.forEach(id=>{ const c=getCountryQuiet(id); if(c) c.confederationId=null; });
    state.confederations = state.confederations.filter(x=>x.id!==conf.id);
    pushLog(`La confédération « ${conf.name} » est dissoute faute de membres.`);
  } else {
    pushLog(`Vous quittez la confédération « ${conf.name} ».`);
  }
  saveGame(); render();
}
function processConfederations(){
  state.confederations.forEach(conf=>{
    const members = conf.members.filter(id=>state.countries[id]);
    if(members.length<2) return;
    const avgInflation = members.reduce((a,id)=>a+state.countries[id].economy.inflation,0)/members.length;
    members.forEach(id=>{
      const c = state.countries[id];
      c.economy.inflation = round1(c.economy.inflation + (avgInflation-c.economy.inflation)*0.15);
      c.economy.growth = round1(c.economy.growth + 0.15);
    });
    for(let i=0;i<members.length;i++){
      for(let j=i+1;j<members.length;j++){
        const rel = getRelation(members[i],members[j]);
        if(rel.status!=='guerre') setRelation(members[i],members[j], {score: clamp(rel.score+0.5,0,100)});
      }
    }
  });
}

   IA DES AUTRES PAYS — chaque nation a sa propre personnalité
   ============================================================ */
const PERSONALITIES = [
  {key:'agressif',       label:'Agressif',        warBias: 2.2, tradeBias:0.5, aidBias:0.3, driftBias:-0.6},
  {key:'pacifique',      label:'Pacifique',       warBias: 0.1, tradeBias:1.2, aidBias:1.8, driftBias: 0.8},
  {key:'commercial',     label:'Commerçant',      warBias: 0.2, tradeBias:2.4, aidBias:0.9, driftBias: 0.5},
  {key:'isolationniste', label:'Isolationniste',  warBias: 0.5, tradeBias:0.3, aidBias:0.2, driftBias:-0.2},
  {key:'opportuniste',   label:'Opportuniste',    warBias: 1.1, tradeBias:1.5, aidBias:0.6, driftBias: 0.0},
];
function personalityOf(c){
  if(c.personality) return PERSONALITIES.find(p=>p.key===c.personality) || PERSONALITIES[4];
  return PERSONALITIES[4];
}
function derivePersonality(base, rng){
  const r = rng();
  const rich = base.gdp/Math.max(1,base.pop)*1e9 > 15000;
  if(r < 0.16) return 'agressif';
  if(r < 0.40) return rich ? 'commercial' : 'opportuniste';
  if(r < 0.62) return 'pacifique';
  if(r < 0.78) return 'isolationniste';
  return 'commercial';
}
/* Les autres pays agissent d'eux-mêmes envers le joueur selon leur caractère. */
function processForeignAI(){
  const p = playerState();
  const rng = mulberry32((hashCode(p.id) ^ (state.player.turn*7919)) >>> 0);
  const ids = Object.keys(state.countries).filter(id=>id!==p.id);
  if(!ids.length) return;
  const actors = pickN(rng, ids, Math.min(3, ids.length));
  actors.forEach(id=>{
    const other = state.countries[id];
    if(!other) return;
    const pers = personalityOf(other);
    const rel = getRelation(p.id, id);
    if(rel.status === 'guerre') return;
    const roll = rng();
    const strong = militaryStrength(other) > militaryStrength(p)*1.25;
    if(roll < 0.05*pers.warBias && rel.score < 32 && strong){
      setRelation(p.id, id, {status:'guerre', score:Math.max(0, rel.score-15)});
      pushLog(`${countryName(id)} déclare la guerre à votre pays.`, p);
      pushWorldNews(`${countryName(id)} déclare la guerre à ${p.name}.`);
    } else if(roll < 0.05*pers.warBias + 0.05*pers.tradeBias && rel.score >= 55 && rel.status!=='alliance'){
      const income = Math.round(p.gdp*1e9*rand(rng,0.0004,0.0016));
      state.contracts.push({id:uid('ct'), a:p.id, b:id, income, turnsLeft:randInt(rng,8,26)});
      setRelation(p.id, id, {status:'accord commercial', score:clamp(rel.score+4,0,100)});
      pushLog(`${countryName(id)} vous propose un accord commercial : +${fmtMoney(income)}/mois.`, p);
    } else if(roll < 0.05*pers.warBias + 0.05*pers.tradeBias + 0.04*pers.aidBias && p.economy.approval < 40){
      const aid = Math.round(p.gdp*1e9*rand(rng,0.0006,0.0025));
      p.budget.treasury += aid;
      setRelation(p.id, id, {status:rel.status==='paix'?'paix':rel.status, score:clamp(rel.score+3,0,100)});
      pushLog(`${countryName(id)} vous accorde une aide internationale de ${fmtMoney(aid)}.`, p);
    } else if(roll > 0.94 && rel.score < 40 && pers.key!=='pacifique'){
      setRelation(p.id, id, {status:'sanctions', score:clamp(rel.score-6,0,100)});
      pushLog(`${countryName(id)} impose des sanctions à votre pays.`, p);
      pushWorldNews(`${countryName(id)} sanctionne ${p.name}.`);
    }
  });
}
function processDiplomacyDrift(){
  const player = state.player.countryId;
  Object.keys(state.relations).forEach(k=>{
    if(!k.split('|').includes(player)) return;
    const rel = state.relations[k];
    if(rel.status==='guerre') return;
    if(rel.score>50) rel.score = round1(Math.max(50, rel.score-0.04));
    else if(rel.score<50) rel.score = round1(Math.min(50, rel.score+0.04));
  });
}

function processSport(){
  const p = playerState();
  state.nextSportEvent--;
  if(state.nextSportEvent > 0) return;
  const rng = mulberry32((state.player.turn*97531) >>> 0);
  state.nextSportEvent = randInt(rng, 10, 16);
  const scored = COUNTRIES_DATA.map(base=>{
    const c = state.countries[base.id];
    const d = c.sport.disciplines;
    const avg = (d.football+d.athletisme+d.basketball+d.natation)/4;
    return { id: c.id, score: avg + rand(rng,-15,15) };
  }).sort((a,b)=>b.score-a.score);
  const podium = scored.slice(0,3);
  const medalKeys = ['or','argent','bronze'];
  podium.forEach((entry,i)=>{
    const c = state.countries[entry.id];
    c.sport.medals[medalKeys[i]]++;
    c.sport.prestige = clamp(c.sport.prestige + (3-i)*2, 0, 100);
  });
  pushWorldNews(`Compétition sportive internationale : 🥇 ${countryName(podium[0].id)}, 🥈 ${countryName(podium[1].id)}, 🥉 ${countryName(podium[2].id)}.`);
  const rank = podium.findIndex(e=>e.id===p.id);
  if(rank>=0){
    p.economy.approval = clamp(p.economy.approval + (3-rank)*3, 0, 100);
    const medalLabel = medalKeys[rank]==='or' ? "d'or" : (medalKeys[rank]==='argent' ? "d'argent" : 'de bronze');
    pushLog(`Votre équipe nationale monte sur le podium international : médaille ${medalLabel} !`, p);
  }
}

function investResource(resId, kind){
  const c = playerState();
  const r = (c.resources||[]).find(x=>x.id===resId);
  if(!r) return;
  const level = kind==='extraction' ? (r.extraction||0) : (r.refining||0);
  const max = kind==='extraction' ? 200 : 100;
  if(level >= max){ toast(kind==='extraction' ? "Exploitation déjà au maximum." : "Raffinage déjà au maximum."); return; }
  const cost = resourceUpgradeCost(c, r, kind);
  if(c.budget.treasury < cost){ toast(`Trésor insuffisant (${fmtMoney(cost)} nécessaires).`); return; }
  c.budget.treasury -= cost;
  if(kind==='extraction') r.extraction = clamp(level+10, 0, max);
  else r.refining = clamp(level+10, 0, max);
  pushLog(kind==='extraction'
    ? `Investissement dans l'exploitation de ${r.name} : capacité portée à ${r.extraction} %.`
    : `Nouvelle unité de transformation pour ${r.name} : raffinage à ${r.refining} %.`, c);

function setIntelTarget(id){ state.intelTarget = id; render(); }
function espionageOdds(c, target){
  const cap = (c.intelligence&&c.intelligence.capability!=null) ? c.intelligence.capability : 30;
  const counter = (target.intelligence&&target.intelligence.counterIntel!=null) ? target.intelligence.counterIntel : 30;
  return clamp(50 + (cap-counter)*0.7, 6, 92);
}
function spyOnCountry(targetId){
  const c = playerState();
  const target = state.countries[targetId];
  if(!target || targetId===c.id) return;
  const cost = Math.max(c.gdp*1e9*0.0004, 3e6);
  if(c.budget.treasury < cost){ toast(`Trésor insuffisant (${fmtMoney(cost)} nécessaires).`); return; }
  c.budget.treasury -= cost;
  const rng = mulberry32((hashCode(c.id+targetId+'spy') ^ (state.player.turn*97711)) >>> 0);
  const odds = espionageOdds(c, target);
  if(rng()*100 < odds){
    state.espionageReports[targetId] = {
      turn: state.player.turn, gdp: target.gdp, growth: target.economy.growth, debt: target.budget.debt,
      troops: target.military.troops, arms: target.military.arms,
      resourceRevenue: Math.round(totalResourceRevenue(target)), approval: target.economy.approval,
      corruption: target.social.corruption, regime: target.regime,
    };
    pushLog(`Opération de renseignement réussie sur ${countryName(targetId)} : rapport détaillé obtenu.`, c);

    setRelation(c.id, targetId, {score: clamp(getRelation(c.id,targetId).score-6, 0, 100)});
    pushLog(`Un agent est démasqué en tentant d'espionner ${countryName(targetId)} : incident diplomatique.`, c);

const SABOTAGE_KINDS = [
  {key:'economie', label:"Saboter l'économie", desc:'Ralentit la croissance de la cible pendant 6 mois.'},
  {key:'armee', label:"Saboter l'armée", desc:'Détruit une partie des troupes ennemies sur le coup.'},

function sabotageOperation(targetId, kind){
  const c = playerState();
  const target = state.countries[targetId];
  const def = SABOTAGE_KINDS.find(k=>k.key===kind);
  if(!target || !def || targetId===c.id) return;
  const cost = Math.max(c.gdp*1e9*0.0012, 8e6);
  if(c.budget.treasury < cost){ toast(`Trésor insuffisant (${fmtMoney(cost)} nécessaires).`); return; }
  c.budget.treasury -= cost;
  const rng = mulberry32((hashCode(c.id+targetId+kind+'sab') ^ (state.player.turn*63811)) >>> 0);
  const odds = espionageOdds(c, target)*0.75;
  if(rng()*100 < odds){
    if(kind==='armee'){
      const loss = Math.round(target.military.troops*rand(rng,0.05,0.14));
      target.military.troops = Math.max(0, target.military.troops-loss);
      pushLog(`Sabotage réussi : ${fmtNum(loss)} soldats ennemis hors service chez ${countryName(targetId)}.`, c);
    } else {
      target.intelligence = target.intelligence || { capability:30, counterIntel:30, sabotage:null };
      target.intelligence.sabotage = { kind, magnitude: rand(rng,0.6,1.4), turnsLeft: 6 };
      pushLog(`Sabotage réussi contre ${countryName(targetId)} (${def.label.toLowerCase()}).`, c);
    }
    pushWorldNews(`Une opération de sabotage frappe ${countryName(targetId)}.`);
    toast('Sabotage réussi.');
  } else {
    setRelation(c.id, targetId, {score: clamp(getRelation(c.id,targetId).score-14, 0, 100)});
    c.economy.approval = round1(clamp(c.economy.approval-2, 0, 100));
    pushLog(`Opération de sabotage déjouée par ${countryName(targetId)} : scandale diplomatique.`, c);
    toast('Sabotage déjoué : la relation se dégrade fortement.');
  }
  checkAchievements();
  saveGame(); render();
}

function proposeResolution(orgKey, typeKey){

  state.resolutions = (state.resolutions||[]).concat([{
    turn: state.player.turn, org: org.name, orgKey, target: targetId,
    type: type.label, typeKey, yes: v.yes, no: v.no, passed: v.passed,
  }]);
  if(state.resolutions.length > 40) state.resolutions.shift();
  const target = state.countries[targetId];
  if(v.passed && target){
    if(typeKey==='condamnation'){
      orgMembers(org).forEach(id=>{
        if(id===targetId) return;
        setRelation(id, targetId, {score: clamp(getRelation(id,targetId).score-4, 0, 100)});
      });
      pushLog(`${org.name} condamne ${countryName(targetId)} (${v.yes} voix contre ${v.no}).`, c);
      pushWorldNews(`${org.name} adopte une résolution condamnant ${countryName(targetId)}.`);
    } else if(typeKey==='sanctions'){
      target.sanctions = Math.max(target.sanctions||0, 18);
      orgMembers(org).forEach(id=>{
        if(id===targetId) return;
        setRelation(id, targetId, {status:'sanctions', score: clamp(getRelation(id,targetId).score-8, 0, 100)});
      });
      pushLog(`${org.name} vote des sanctions contre ${countryName(targetId)} (${v.yes}-${v.no}).`, c);
      pushWorldNews(`Sanctions internationales votées contre ${countryName(targetId)}.`);
    } else {
      const aid = Math.round(target.gdp*1e9*0.004);
      target.budget.treasury = Math.max(0,(target.budget.treasury||0)) + aid;
      setRelation(c.id, targetId, {score: clamp(getRelation(c.id,targetId).score+8, 0, 100)});
      c.budget.treasury = Math.max(0, c.budget.treasury - c.gdp*1e9*0.001);
      pushLog(`${org.name} accorde une aide à ${countryName(targetId)} : votre relation s'améliore.`, c);
    }
    toast('Résolution adoptée.');
  } else {
    pushLog(`La résolution « ${type.label} » visant ${countryName(targetId)} est rejetée (${v.yes} pour, ${v.no} contre).`, c);
    toast('Résolution rejetée.');
  }
  saveGame(); render();
}

function hireEmployees(companyId){

  const co = c.companies.find(x=>x.id===companyId);
  if(!co) return;
  const amount = Math.max(20, Math.round(co.employees*0.08));
  const cost = amount * co.salary * 3;
  if(c.budget.treasury < cost){ toast(`Trésor insuffisant (${fmtMoney(cost)} nécessaires).`); return; }
  c.budget.treasury -= cost;
  co.employees += amount;
  co.value = Math.round(co.value * 1.02);
  const unemploymentDrop = Math.min(0.5, (amount / c.population) * 500);
  c.economy.unemployment = round1(Math.max(1, c.economy.unemployment - unemploymentDrop));
  pushLog(`${co.name} embauche ${fmtNum(amount)} employés supplémentaires.`, c);
  saveGame(); render();
}

function buildInfra(cityId, typeKey){
  const c = playerState();
  const city = c.cities.find(x=>x.id===cityId);
  const type = INFRA_TYPES.find(t=>t.key===typeKey);
  if(!city || !type) return;
  if(type.requiresCoastal && !city.coastal){ toast(`${city.name} n'a pas d'accès maritime ou fluvial : port impossible.`); return; }
  if(type.minCityPop && city.population < type.minCityPop){
    toast(`${city.name} est trop peu peuplée pour un projet de ce type (${fmtNum(type.minCityPop)} habitants requis).`); return;
  }
  if(type.capped && (city.infra.roads||0)>=100){ toast('Réseau routier déjà au maximum.'); return; }
  const cost = infraCost(type, c);
  if(c.budget.treasury < cost){ toast(`Trésor insuffisant (${fmtMoney(cost)} nécessaires).`); return; }
  c.budget.treasury -= cost;
  if(type.capped) city.infra.roads = clamp((city.infra.roads||0)+type.step,0,100);
  else city.infra[type.key] = ((city.infra[type.key])||0) + type.step;
  c.economy.approval = clamp(c.economy.approval+0.6,0,100);
  pushLog(`${type.label} amélioré à ${city.name}.`, c);
  saveGame(); render();
}

function recruitAmount(kind, c){
  const current = kind==='police' ? c.police.officers : c.military.troops;
  return Math.max(50, Math.round(current*0.05));
}
function recruit(kind){
  const c = playerState();
  const amount = recruitAmount(kind, c);
  if(kind==='police'){
    const cost = amount*8000;
    if(c.budget.treasury<cost){ toast(`Trésor insuffisant (${fmtMoney(cost)} nécessaires).`); return; }
    c.budget.treasury -= cost; c.police.officers += amount;
    pushLog(`${fmtNum(amount)} policiers supplémentaires recrutés.`, c);
  } else {
    const cost = amount*15000;
    if(c.budget.treasury<cost){ toast(`Trésor insuffisant (${fmtMoney(cost)} nécessaires).`); return; }
    c.budget.treasury -= cost; c.military.troops += amount;
    pushLog(`${fmtNum(amount)} soldats supplémentaires enrôlés.`, c);
  }
  saveGame(); render();
}
function modernize(kind){
  const c = playerState();

  c.budget.treasury -= cost;
  if(kind==='police') c.police.equipment = clamp(c.police.equipment+8,0,100);
  else c.military.arms = clamp(c.military.arms+8,0,100);
  pushLog(kind==='police' ? "Modernisation de l'équipement policier." : "Modernisation de l'arsenal militaire.", c);

}

function activeWarsCount(id){

function computeAlerts(c){
  const alerts = [];
  const debtRatio = c.budget.debt/(c.gdp*1e9)*100;
  if(c.economy.approval<30) alerts.push({level:'bad', msg:'Popularité critique : risque de troubles sociaux.'});
  if(debtRatio>80) alerts.push({level:'bad', msg:'Dette publique alarmante ('+round1(debtRatio)+'% du PIB).'});
  else if(debtRatio>40) alerts.push({level:'warn', msg:'Dette publique élevée ('+round1(debtRatio)+'% du PIB).'});
  if(c.economy.unemployment>25) alerts.push({level:'bad', msg:'Chômage de masse ('+fmtPct(c.economy.unemployment)+').'});
  if(c.police.crimeIndex>70) alerts.push({level:'bad', msg:'Criminalité hors de contrôle.'});
  const wars = activeWarsCount(c.id);
  if(wars>0) alerts.push({level:'bad', msg:`En guerre avec ${wars} pays.`});
  if(c.economy.inflation>20) alerts.push({level:'warn', msg:'Inflation galopante ('+fmtPct(c.economy.inflation)+').'});
  return alerts;
}

}

function render(){
  const app = document.getElementById('app');
  if(!state || state.screen==='select'){
    app.innerHTML = renderSelectScreen();
    return;
  }
  if(state.defeated){
    app.innerHTML = renderDefeat();

  }
  app.innerHTML = renderShell();
  if(state.activeTab==='map') initMap();

function peekSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    const c = s.countries[s.player.countryId];
    if(!c) return null;
    const d = new Date(GAME_START); d.setUTCMonth(d.getUTCMonth()+s.player.turn);
    return { name: c.name, iso2: c.iso2, dateLabel: `${MONTHS_FR[d.getUTCMonth()]} ${d.getUTCFullYear()}` };
  }catch(e){ return null; }
}
function renderSelectScreen(){
  const groups = {};
  COUNTRIES_DATA.forEach(c=>{ (groups[c.continent] = groups[c.continent]||[]).push(c); });
  const order = ['Afrique','Amérique du Nord','Amérique du Sud','Asie','Europe','Océanie'];
  let resumeHtml = '';
  const preview = peekSave();

    resumeHtml = `<div class="resume-bar">

      </div>
      <button class="btn primary" onclick="resumeGame()">Reprendre la partie</button>
    </div>`;
  }

      <button class="country-card" onclick="confirmStart('${c.id}')">

        <div class="cname">${escapeHtml(c.name)}</div>

  }).join('');
  return `<div class="select-screen">
    <div class="select-hero">
      <div class="seal-big">★</div>
      <h1>Hakvision Président</h1>
      <p>Choisissez l'un des 195 pays du monde et prenez la tête de son gouvernement : économie, diplomatie, armée, ressources, institutions. Un mode Éditeur permet de tout façonner librement, en bac à sable.</p>

/* ---- Dashboard ---- */
function renderDashboard(){
  const c = playerState();
  const mandatePct = Math.round(c.mandate.turnsElapsed / c.mandate.length * 100);
  const debtRatio = c.budget.debt / (c.gdp*1e9) * 100;
  const kpis = [

const MAP_LAYERS = [
  {id:'relations', label:'Relations diplomatiques'},
  {id:'confederations', label:'Confédérations'},
  {id:'gdppc', label:'PIB par habitant'},
  {id:'mortality', label:'Taux de mortalité'},
  {id:'lifeexpectancy', label:'Espérance de vie'},
];
function mapLayerValue(layer, c){
  if(layer==='gdppc') return c.gdp*1e9/c.population;
  if(layer==='mortality') return c.social.mortalityRate;
  if(layer==='lifeexpectancy') return c.social.lifeExpectancy;
  return null;
}
function heatColor(t){
  t = Math.max(0,Math.min(1,t));
  const stops = [[58,90,128],[211,172,58],[193,80,58]];
  let c1,c2,lt;
  if(t<0.5){ c1=stops[0]; c2=stops[1]; lt=t*2; } else { c1=stops[1]; c2=stops[2]; lt=(t-0.5)*2; }
  const r = Math.round(c1[0]+(c2[0]-c1[0])*lt);
  const g = Math.round(c1[1]+(c2[1]-c1[1])*lt);
  const b = Math.round(c1[2]+(c2[2]-c1[2])*lt);
  return `rgb(${r},${g},${b})`;
}
function renderMap(){
  const layer = state.mapLayer || 'relations';
  return `
  <h1>Carte du monde</h1>
  <div class="subtitle">Cliquez sur un pays pour consulter ses informations et agir directement depuis la carte (195 pays au total, 174 représentés sur la carte).</div>

}
function renderMapLegend(layer){
  if(layer==='relations'){
    return `
    <div class="row"><span class="rl"><i class="dot" style="background:var(--brass)"></i> Votre pays</span></div>
    <div class="row"><span class="rl"><i class="dot" style="background:var(--good)"></i> Alliance</span></div>
    <div class="row"><span class="rl"><i class="dot" style="background:var(--info)"></i> Accord commercial</span></div>

    <div class="row"><span class="rl"><i class="dot" style="background:var(--surface-3)"></i> Paix (neutre)</span></div>`;

  const min = values.length?Math.min(...values):0, max = values.length?Math.max(...values):0;

  return `

function initMap(){
  const svg = document.getElementById('worldMapSvg');
  if(!svg) return;
  svg.querySelectorAll('path[id], g[id]').forEach(el=>{
    const iso = el.id.toLowerCase();
    const country = COUNTRIES_DATA.find(c=>c.iso2.toLowerCase()===iso);
    if(!country) return;
    el.dataset.countryId = country.id;
    el.addEventListener('click', ()=> selectMapCountry(country.id));
  });
  paintMapColors();
}
function paintMapColors(){
  const svg = document.getElementById('worldMapSvg');
  if(!svg) return;
  const layer = state.mapLayer || 'relations';
  const playerId = state.player.countryId;
  const els = svg.querySelectorAll('[data-country-id]');
  if(layer==='relations'){
    els.forEach(el=>{
      el.classList.remove('map-player','map-ally','map-war','map-sanctions','map-trade','map-selected');
      el.style.fill = '';
      const id = el.dataset.countryId;
      if(id===state.mapSelected) el.classList.add('map-selected');
      if(id===playerId){ el.classList.add('map-player'); return; }
      const rel = getRelation(playerId, id);
      if(rel.status==='guerre') el.classList.add('map-war');
      else if(rel.status==='alliance') el.classList.add('map-ally');
      else if(rel.status==='sanctions') el.classList.add('map-sanctions');
      else if(rel.status==='accord commercial') el.classList.add('map-trade');
    });
  } else if(layer==='confederations'){
    const confColor = {};
    state.confederations.forEach((cf,i)=>{ confColor[cf.id] = CONF_PALETTE[i%CONF_PALETTE.length]; });
    els.forEach(el=>{
      el.classList.remove('map-player','map-ally','map-war','map-sanctions','map-trade');
      el.classList.toggle('map-selected', el.dataset.countryId===state.mapSelected);
      const c = state.countries[el.dataset.countryId];
      el.style.fill = c && c.confederationId ? confColor[c.confederationId] : '';
    });
  } else {
    const values = Object.values(state.countries).map(c=>mapLayerValue(layer,c)).filter(v=>isFinite(v));
    const min = values.length?Math.min(...values):0, max = values.length?Math.max(...values):1;
    els.forEach(el=>{
      el.classList.remove('map-player','map-ally','map-war','map-sanctions','map-trade');
      el.classList.toggle('map-selected', el.dataset.countryId===state.mapSelected);
      const c = state.countries[el.dataset.countryId];
      const v = c ? mapLayerValue(layer,c) : null;
      const t = (isFinite(v) && max>min) ? (v-min)/(max-min) : 0.5;
      el.style.fill = isFinite(v) ? heatColor(t) : '';
    });
  }
}
function selectMapCountry(id){
  state.mapSelected = id;
  paintMapColors();
  updateMapInfo(id);
}
function updateMapInfo(id){
  const panel = document.getElementById('mapInfo');
  if(panel) panel.innerHTML = renderMapInfoCard(id);
}
function refreshMapIfActive(){
  if(state.activeTab!=='map') return;
  paintMapColors();
  if(state.mapSelected) updateMapInfo(state.mapSelected);
}

function satisfPill(v){
  return `<span class="pill ${v>=60?'good':(v>=45?'warn':'bad')}">${Math.round(v)}/100</span>`;
}
function popGroupRows(groups, dist, ind, total, withSatisfaction){
  return groups.map(g=>{
    const pct = dist[g.key]||0;
    const heads = Math.round(total*pct/100);
    const sat = withSatisfaction ? groupSatisfaction(g.key, ind) : null;
    return `<div class="row" style="align-items:flex-start;">
      <span class="rl">${escapeHtml(g.label)}<br><span style="font-size:11px;color:var(--muted-2);">${fmtNum(heads)} personnes</span>

      </span>
      <span style="text-align:right;white-space:nowrap;">
        <span class="rv num" style="display:block;">${round1(pct)} %</span>
        ${sat!=null ? `<span style="display:block;margin-top:5px;">${satisfPill(sat)}</span>` : ''}
      </span>
    </div>`;
  }).join('');
}

  const happiest = groupSats.slice(0,3), angriest = groupSats.slice(-3).reverse();
