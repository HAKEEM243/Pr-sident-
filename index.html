<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hakvision Président</title>
<meta name="description" content="Hakvision Président : simulateur de chef d'État où vous dirigez n'importe quel pays du monde — économie, diplomatie, armée, ressources, institutions — avec un mode éditeur en bac à sable et une carte du monde.">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%230b1220'/%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%23c9a227' stroke-width='4'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle' fill='%23c9a227' font-family='Georgia,serif'%3E%E2%98%85%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   TOKENS — palette "salle de commandement d'État", thème sombre
   assumé (voir design plan) : encre navy, parchemin, laiton.
   ============================================================ */
:root{
  --ink:#0a1120;
  --ink-2:#0e1729;
  --surface:#121b30;
  --surface-2:#1a2540;
  --surface-3:#22304f;
  --border:#2a3a5c;
  --border-soft:#1e2c48;
  --parchment:#eee6d3;
  --parchment-dim:#c9c2ab;
  --muted:#8d97ac;
  --muted-2:#69748c;
  --brass:#d3ac3a;
  --brass-soft:#8a7326;
  --brass-dim:#5c4f22;
  --seal-red:#c1503a;
  --seal-red-soft:#3a201c;
  --good:#4f9d6e;
  --good-soft:#183327;
  --warn:#d9822b;
  --warn-soft:#3a2712;
  --info:#5b8fc9;
  --shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --radius: 10px;
  --radius-lg: 16px;
  --font-display: "Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
  --font-body: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(211,172,58,.08), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(91,143,201,.07), transparent 55%),
    var(--ink);
  color:var(--parchment);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--brass-dim);color:var(--parchment);}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0 0 .35em;color:var(--parchment);}
p{margin:0 0 .6em;color:var(--muted);line-height:1.5;}
a{color:var(--brass);}
button, select, input, textarea{font-family:inherit;font-size:14px;color:var(--parchment);}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
button{cursor:pointer;}
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--brass); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* Scrollbars, subtle */
::-webkit-scrollbar{height:10px;width:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:12px 18px;border-bottom:1px solid var(--border-soft);
  background:linear-gradient(180deg, var(--ink-2), var(--ink));
  position:sticky;top:0;z-index:20;
}
.seal{
  width:34px;height:34px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 28%, #f3d878, var(--brass) 45%, var(--brass-soft) 78%, var(--brass-dim) 100%);
  border:1px solid var(--brass-dim);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:16px;
  box-shadow: inset 0 1px 2px rgba(255,255,255,.4), 0 2px 6px rgba(0,0,0,.4);
}
.brand{display:flex;flex-direction:column;line-height:1.1;}
.brand b{font-family:var(--font-display);font-size:16px;letter-spacing:.02em;}
.brand span{font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.09em;}

.topbar .country-chip{
  display:flex;align-items:center;gap:8px;margin-left:8px;
  padding:5px 12px 5px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
  font-size:13px;
}
.topbar .country-chip .flag{font-size:18px;}
.ticker{display:flex;gap:18px;margin-left:auto;align-items:center;}
.ticker .t-item{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;}
.ticker .t-item .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);}
.ticker .t-item .v{font-size:13px;font-weight:600;}
.pos{color:var(--good);} .neg{color:var(--seal-red);} .warn{color:var(--warn);}
.icon-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--parchment);
  border-radius:8px;padding:7px 10px;font-size:12px;display:flex;align-items:center;gap:6px;
}
.icon-btn:hover{background:var(--surface-3);}
.icon-btn.on{background:var(--brass-dim);border-color:var(--brass-soft);color:var(--parchment);}
.menu-dropdown{position:relative;}
.menu-panel{
  display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:220px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:6px;
  flex-direction:column;gap:2px;box-shadow:var(--shadow);
}
.menu-panel.open{display:flex;}
.menu-panel button, .menu-panel label{
  all:unset;padding:9px 11px;border-radius:7px;font-size:12.5px;color:var(--parchment);cursor:pointer;display:block;
}
.menu-panel button:hover, .menu-panel label:hover{background:var(--surface-3);}
.menu-panel input[type=file]{display:none;}

.shell{display:flex;flex:1;min-height:0;}
.sidenav{
  width:220px;flex:none;border-right:1px solid var(--border-soft);
  background:var(--ink-2);padding:14px 10px;display:flex;flex-direction:column;gap:2px;
}
.sidenav button{
  all:unset;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
  color:var(--muted);font-size:13.5px;cursor:pointer;
}
.sidenav button .ic{width:20px;text-align:center;font-size:15px;}
.sidenav button:hover{background:var(--surface-2);color:var(--parchment);}
.sidenav button.active{background:var(--surface-2);color:var(--parchment);box-shadow:inset 3px 0 0 var(--brass);}
.sidenav .divider{height:1px;background:var(--border-soft);margin:10px 4px;}

main.view{flex:1;min-width:0;padding:22px 26px 90px;overflow-y:auto;}
.view h1{font-size:22px;}
.view .subtitle{margin-top:-6px;margin-bottom:18px;font-size:13px;color:var(--muted-2);}

/* Bottom tab bar for mobile */
.bottomnav{display:none;}

@media (max-width: 860px){
  .sidenav{display:none;}
  .ticker{display:none;}
  main.view{padding:16px 14px 84px;}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;
    background:var(--ink-2);border-top:1px solid var(--border-soft);
    overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;
  }
  .bottomnav button{
    all:unset;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:6px 12px;border-radius:8px;color:var(--muted);font-size:10px;min-width:58px;text-align:center;
  }
  .bottomnav button .ic{font-size:17px;}
  .bottomnav button.active{color:var(--brass);}
}

/* ============================================================
   COMPONENTS
   ============================================================ */
.grid{display:grid;gap:14px;}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
.grid.cols2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));}
.card{
  background:linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--surface-2));
  border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  padding:16px 18px;box-shadow:var(--shadow);
}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px;font-family:var(--font-body);font-weight:600;}
.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted-2);margin-bottom:6px;}
.kpi .value{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums;}
.kpi .delta{font-size:11.5px;margin-top:4px;}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
.row:last-child{border-bottom:none;}
.row .rl{color:var(--muted);font-size:13px;}
.row .rv{font-weight:600;font-size:13.5px;}

.btn{
  background:var(--surface-3);border:1px solid var(--border);color:var(--parchment);
  padding:9px 15px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
}
.btn:hover{border-color:var(--brass-soft);}
.btn.primary{background:linear-gradient(180deg,#e2bd53,var(--brass));color:#231a04;border-color:var(--brass-soft);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.danger{background:var(--seal-red-soft);border-color:var(--seal-red);color:#ffd9cf;}
.btn.ghost{background:transparent;}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;}
.pill.good{background:var(--good-soft);color:#8fe0ac;}
.pill.warn{background:var(--warn-soft);color:#f0b169;}
.pill.bad{background:var(--seal-red-soft);color:#ff9c88;}
.pill.info{background:#152640;color:#8fbaf0;}
.pill.neutral{background:var(--surface-3);color:var(--muted);}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.field .hint{font-size:11px;color:var(--muted-2);}
input[type=text], input[type=number], select, textarea{
  background:var(--ink-2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;width:100%;
}
textarea{resize:vertical;min-height:60px;}
input[type=range]{width:100%;accent-color:var(--brass);}
.slider-row{display:flex;align-items:center;gap:10px;}
.slider-row .sv{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--brass);}

.bar{height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden;}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-soft),var(--brass));}
.bar.good > i{background:linear-gradient(90deg,#2f6b46,var(--good));}
.bar.bad > i{background:linear-gradient(90deg,#7a2c1e,var(--seal-red));}

.search{position:relative;margin-bottom:14px;}
.search input{padding-left:30px;}
.search::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted-2);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-2);padding:8px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);}
td{padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tr:hover td{background:var(--surface-2);}
.table-wrap{max-height:60vh;overflow:auto;border:1px solid var(--border-soft);border-radius:var(--radius-lg);}

.log{display:flex;flex-direction:column-reverse;gap:8px;max-height:280px;overflow-y:auto;}
.log .entry{font-size:12.5px;color:var(--muted);padding:8px 10px;background:var(--surface-2);border-left:2px solid var(--brass-soft);border-radius:0 6px 6px 0;}
.log .entry .tag{color:var(--parchment-dim);}
.log .entry time{display:block;font-size:10px;color:var(--muted-2);margin-top:2px;}

.tabs-inline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.tabs-inline button{
  all:unset;padding:7px 13px;border-radius:8px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border-soft);cursor:pointer;
}
.tabs-inline button.active{background:var(--brass-dim);color:var(--parchment);border-color:var(--brass-soft);}

.map-wrap{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:10px;overflow:hidden;box-shadow:var(--shadow);}
.map-wrap svg{width:100%;height:auto;display:block;}
.map-wrap svg path, .map-wrap svg g{fill:var(--surface-3);stroke:var(--ink);stroke-width:0.6;cursor:pointer;transition:fill .12s;}
.map-wrap svg path:hover, .map-wrap svg g:hover{fill:var(--brass-soft);}
.map-wrap svg .map-player{fill:var(--brass);}
.map-wrap svg .map-ally{fill:var(--good);}
.map-wrap svg .map-war{fill:var(--seal-red);}
.map-wrap svg .map-sanctions{fill:var(--warn);}
.map-wrap svg .map-trade{fill:var(--info);}
.map-wrap svg .map-selected{stroke:var(--brass);stroke-width:2.2px;}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}

.city-card{border:1px solid var(--border-soft);border-radius:10px;padding:12px;background:var(--surface-2);}
.city-card h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.infra-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:12px;}
.infra-grid .ig{display:flex;justify-content:space-between;background:var(--ink-2);padding:6px 8px;border-radius:6px;}

.editor-banner{
  background:var(--seal-red-soft);border:1px solid var(--seal-red);color:#ffcabf;
  padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center;
}

.empty{text-align:center;padding:40px 20px;color:var(--muted-2);}

/* ---------- Country select screen ---------- */
.select-screen{width:100%;max-width:1080px;margin:0 auto;padding:40px 20px 70px;}
.select-hero{text-align:center;margin-bottom:30px;}
.select-hero .seal-big{
  width:76px;height:76px;border-radius:50%;margin:0 auto 16px;
  background:radial-gradient(circle at 32% 28%, #f6e19a, var(--brass) 45%, var(--brass-soft) 78%, var(--brass-dim) 100%);
  border:2px solid var(--brass-dim); display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:34px;color:var(--ink);
  box-shadow: inset 0 2px 4px rgba(255,255,255,.45), 0 6px 20px rgba(0,0,0,.5);
}
.select-hero h1{font-size:30px;}
.select-hero p{max-width:520px;margin:0 auto;}
.continent-group{margin-bottom:22px;}
.continent-group h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted-2);margin:0 0 10px 2px;}
.country-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.country-card{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:12px;text-align:left;
  display:flex;flex-direction:column;gap:6px;
}
.country-card:hover{border-color:var(--brass-soft);background:var(--surface-2);}
.country-card .cflag{font-size:26px;}
.country-card .cname{font-weight:600;font-size:13.5px;}
.country-card .cmeta{font-size:11px;color:var(--muted-2);}
.resume-bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--brass-soft);border-radius:12px;padding:14px 18px;margin-bottom:26px;
}

.toast-wrap{position:fixed;bottom:16px;right:16px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:320px;}
.toast{background:var(--surface-3);border:1px solid var(--brass-soft);border-radius:10px;padding:10px 14px;font-size:12.5px;box-shadow:var(--shadow);animation:toastin .25s ease-out;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

@media (max-width:600px){
  .topbar{padding:10px 12px;gap:8px;flex-wrap:wrap;row-gap:8px;}
  .brand span{display:none;}
  .country-chip{margin-left:0;}
  .icon-btn{padding:6px 9px;font-size:11px;}
}

/* ============================================================
   MOBILE-FIRST — le jeu doit être agréable au doigt avant tout
   ============================================================ */
@media (max-width: 900px){
  /* Une seule colonne : plus de cartes écrasées côte à côte. */
  .grid.cols2{grid-template-columns:1fr;}
  .grid.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .grid{gap:12px;}

  /* Cibles tactiles : 44px minimum, comme sur une vraie app. */
  .btn{min-height:44px;padding:11px 16px;font-size:14px;}
  .btn.sm{min-height:40px;padding:9px 13px;font-size:13px;}
  .btn-row{gap:8px;}
  .btn-row .btn{flex:1 1 auto;justify-content:center;}

  /* 16px : en dessous, iOS zoome tout seul sur le champ. */
  input[type=text], input[type=number], select, textarea{
    font-size:16px;min-height:44px;
  }
  .field label{font-size:12px;}

  /* Les lignes label/valeur passent à la ligne au lieu de se comprimer. */
  .row{flex-wrap:wrap;row-gap:4px;padding:10px 0;}
  .row .rl{flex:1 1 60%;min-width:0;}
  .row .rv{flex:0 0 auto;margin-left:auto;}

  h1{font-size:20px;}
  .card{padding:14px;}
  .city-card{padding:14px;}
  .infra-grid{grid-template-columns:repeat(2,1fr);gap:10px;}

  /* Tableaux : plus lisibles, actions empilées. */
  table{font-size:13px;}
  table th, table td{padding:9px 8px;}
  .table-wrap{max-height:none;}
  #diploTbody .btn-row{flex-direction:row;flex-wrap:wrap;}
  #diploTbody .btn-row .btn{flex:1 1 44%;}

  /* Barre d'onglets : défilement fluide et repères au doigt. */
  .bottomnav{
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .bottomnav::-webkit-scrollbar{display:none;}
  .bottomnav button{
    scroll-snap-align:center;min-width:64px;min-height:52px;padding:7px 12px;font-size:10.5px;
  }
  .bottomnav button .ic{font-size:19px;}

  /* Sélecteurs inline (Journal : Mon pays / Monde) : eux aussi au doigt. */
  .tabs-inline button{min-height:40px;padding:9px 14px;font-size:13px;}

  /* Les notifications ne doivent jamais passer sous la barre d'onglets. */
  .toast-wrap{
    left:12px;right:12px;max-width:none;
    bottom:calc(76px + env(safe-area-inset-bottom));
  }
}

/* Appareils tactiles : pas de surbrillance grise au tap, pas de délai de 300ms. */
@media (hover: none){
  .btn, .bottomnav button, .sidenav button, .country-card, .icon-btn{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .btn:hover{border-color:var(--border);}
  .btn.primary:hover{filter:none;}
}

@media (max-width: 420px){
  main.view{padding:14px 11px 88px;}
  .card{padding:12px;}
  h1{font-size:18px;}
  .subtitle{font-size:12px;}
  .btn-row .btn{flex:1 1 100%;}
  #diploTbody .btn-row .btn{flex:1 1 100%;}
  .infra-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashCode(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) | 0; }
  return h;
}
function rngFor(id){ return mulberry32(hashCode(id)); }
function rand(rng,min,max){ return min + rng()*(max-min); }
function randInt(rng,min,max){ return Math.floor(rand(rng,min,max+1)); }
function pick(rng,arr){ return arr[Math.floor(rng()*arr.length)]; }
function pickN(rng,arr,n){
  const pool = arr.slice(); const out=[];
  n = Math.min(n, pool.length);
  for(let i=0;i<n;i++){ const idx = Math.floor(rng()*pool.length); out.push(pool.splice(idx,1)[0]); }
  return out;
}
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function round1(v){ return Math.round(v*10)/10; }
function fmtNum(n){
  n = Number(n)||0;
  const s = n<0 ? '-' : '';
  n = Math.abs(n);
  if(n>=1e9) return s+round1(n/1e9)+' Md';
  if(n>=1e6) return s+round1(n/1e6)+' M';
  if(n>=1e3) return s+round1(n/1e3)+' k';
  return s+Math.round(n);
}
function fmtMoney(n){ return fmtNum(n)+' $'; }
function fmtPct(n){ return round1(Number(n)||0)+' %'; }
function flagEmoji(iso2){
  if(!iso2 || iso2.length!==2) return '\u{1F3F3}\u{FE0F}';
  return String.fromCodePoint(...[...iso2.toUpperCase()].map(c=>127397+c.charCodeAt(0)));
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

}

/* Capacité de production mensuelle de base d'un pays pour une ressource. */
function baseCapacityFor(def, iso2, rng){
  const rank = def.producers.indexOf(iso2);
  const share = rank>=0 ? (RANK_SHARE[rank]!=null ? RANK_SHARE[rank] : 0.1) : 0;
  const capTop = def.worldValue/Math.max(1, def.price);
  if(rank>=0) return Math.round(capTop*share);
  /* Producteur mineur : une fraction marginale. */
  return Math.round(capTop*(rng?rand(rng,0.004,0.03):0.015));
}

function infraCost(type, country){ return Math.max(type.floor, country.gdp*1e9*type.gdpFraction); }
/* Chaque équipement produit un effet réel, proportionnel à la couverture du
   pays (nombre d'équipements rapporté à la population desservie). */
function infraTotals(c){
  const t = {};
  INFRA_TYPES.forEach(x=> t[x.key]=0);
  (c.cities||[]).forEach(city=>{
    INFRA_TYPES.forEach(x=>{ t[x.key] += (city.infra && city.infra[x.key]) || 0; });
  });
  return t;
}
function infraEffects(c){
  const t = infraTotals(c);
  const perMillion = n => c.population>0 ? n/(c.population/1e6) : 0;
  const roadsAvg = (c.cities&&c.cities.length) ? t.roads/c.cities.length : 0;
  return {
    totals: t,
    /* Transport : croissance et échanges */
    growth: clamp(roadsAvg/2200 + perMillion(t.highways)*0.05 + perMillion(t.railways)*0.07
                + perMillion(t.bridges)*0.03 + perMillion(t.metro)*0.04, 0, 0.9),
    trade:  clamp(perMillion(t.ports)*0.09 + perMillion(t.airports)*0.06, 0, 1.2),
    /* Social : santé, éducation, logement */
    health:    clamp(perMillion(t.hospitals)*0.09, 0, 0.9),
    education: clamp(perMillion(t.schools)*0.05 + perMillion(t.universities)*0.10, 0, 0.9),
    housing:   clamp(perMillion(t.housing)*0.06, 0, 0.8),
    metroBonus:clamp(perMillion(t.metro)*0.03, 0, 0.5),
  };
}

/* ============================================================
   COUNTRY GENERATION
   ============================================================ */
function makeCity(idBase, name, pop, coastal, isCapital, rng){
  return {
    id: idBase+'-'+uid('c'),
    name, population: Math.round(pop), coastal: !!coastal, isCapital: !!isCapital,
    infra: {
      roads: randInt(rng,15,55), highways: randInt(rng,0,3),
      railways: randInt(rng,0,2), metro: (pop>1500000 && rng()>.6)?1:0, bridges: randInt(rng,0,4),
      airports: isCapital?1:(coastal? randInt(rng,0,1):0), ports: (coastal && rng()>.5)?1:0,
      schools: Math.max(1, Math.round(pop/60000)), universities: pop>300000 ? randInt(rng,1,3) : 0,
      hospitals: Math.max(1, Math.round(pop/220000)), housing: Math.max(1, Math.round(pop/90000)),
    },
  };
}
function makeResource(def, iso2, rng, boost){
  const cap = Math.max(1, Math.round(baseCapacityFor(def, iso2, rng)*(boost||1)));
  /* Pour les vrais grands producteurs, l'aléa reste étroit : le podium mondial
     doit refléter la réalité (le fer, c'est l'Australie, le cobalt la RDC...). */
  const ranked = def.producers.indexOf(iso2) >= 0;
  return {
    id: uid('res'), type: def.type, name: def.name,
    reserves: Math.round(cap*randInt(rng,220,620)),
    baseCapacity: cap,
    extraction: ranked ? randInt(rng,98,102) : randInt(rng,60,110),
    refining: randInt(rng,0,25),
    grade: ranked ? round1(rand(rng,0.98,1.02)) : round1(rand(rng,0.75,1.35)),
    price: def.price, prevPrice: def.price,
    exploited: true,
    modelV: RESOURCE_MODEL_VERSION,
  };
}
function generateResources(base, rng){
  if(base.id === DRC_ID){
    /* Cheat assumé : la RDC reçoit tout son sous-sol réel, gonflé. */
    return DRC_RESOURCE_TYPES.map(type=>{
      const def = resourceDef(type);
      if(!def) return null;
      const r = makeResource(def, base.iso2, rng, DRC_BOOST);
      r.extraction = randInt(rng,100,115);
      r.grade = round1(rand(rng,1.15,1.35));
      return r;
    }).filter(Boolean);
  }
  /* Un pays reçoit d'abord les ressources dont il est réellement producteur. */
  const real = RESOURCE_POOL.filter(def=> def.producers.indexOf(base.iso2)>=0);
  const extraCount = Math.max(0, randInt(rng,1,3) - Math.min(real.length,2));
  const others = pickN(rng, RESOURCE_POOL.filter(def=> real.indexOf(def)<0), extraCount);
  const chosen = real.concat(others);
  if(!chosen.length) chosen.push(pick(rng, RESOURCE_POOL));
  return chosen.map(def=> makeResource(def, base.iso2, rng, 1));
}
/* Production mensuelle réelle : capacité × niveau d'exploitation × qualité,
   plafonnée par ce qu'il reste dans le sol. */
function resourceProduction(c, r){
  if(!r || !r.exploited) return 0;
  const reserves = Math.max(0, r.reserves||0);
  if(reserves <= 0) return 0;
  const cap = Math.max(0, r.baseCapacity||0);
  const ext = clamp(r.extraction!=null?r.extraction:100, 0, 200)/100;
  const grade = clamp(r.grade!=null?r.grade:1, 0.1, 3);
  return Math.max(0, Math.min(reserves, Math.round(cap*ext*grade)));
}
/* Le raffinage augmente la valeur de vente (pétrole -> carburant, etc.). */
function resourceUnitValue(r){
  const refining = clamp(r.refining!=null?r.refining:0, 0, 100);
  return Math.max(0, (r.price||0)*(1 + refining/100*0.8));
}
function resourceRevenue(c, r){ return resourceProduction(c, r)*resourceUnitValue(r); }
function totalResourceRevenue(c){
  return (c.resources||[]).reduce((a,r)=> a + resourceRevenue(c,r), 0);
}
/* Classement mondial des producteurs, ressource par ressource. */
function resourceRanking(type, limit){
  const rows = [];
  for(const id in state.countries){
    const c = state.countries[id];
    const r = (c.resources||[]).find(x=>x.type===type);
    if(!r) continue;
    const prod = resourceProduction(c, r);
    if(prod<=0) continue;
    rows.push({ id, name:c.name, iso2:c.iso2, production:prod, value:prod*resourceUnitValue(r) });
  }
  rows.sort((a,b)=> b.production-a.production);
  return limit ? rows.slice(0, limit) : rows;
}
function resourceRankOf(countryId, type){
  const rows = resourceRanking(type);
  const i = rows.findIndex(r=>r.id===countryId);
  return { rank: i>=0 ? i+1 : null, total: rows.length };
}
/* Coût d'un palier d'amélioration : proportionnel à ce que la ressource rapporte. */
function resourceUpgradeCost(c, r, kind){
  const annual = resourceRevenue(c, r)*12;
  const level = kind==='extraction' ? (r.extraction||0) : (r.refining||0);
  const base = Math.max(annual*0.35, c.gdp*1e9*0.0008);
  return Math.round(base*(1 + level/100));
}
function generateCompanies(base, rng){
  const n = randInt(rng,2,4);
  const sectors = pickN(rng, COMPANY_SECTORS, n);
  const gdpPerCapita = base.gdp*1e9/base.pop;
  return sectors.map(sector=>{
    const value = Math.round(rand(rng, base.gdp*1e6*0.5, base.gdp*1e6*3));
    const salary = Math.max(50, Math.round(gdpPerCapita*rand(rng,0.5,1.3)/12));
    const employees = Math.max(30, Math.round(value/(salary*36)));
    return {
      id: uid('co'), name: sector+' '+pick(rng,['Group','National','Holding','& Associés','Corp']),
      sector, ownership: rng()>.5?'public':'privée', value, ceo: randomCeoName(rng),
      salary, employees,
    };
  });
}
const POP_MILESTONES = [1e6,5e6,10e6,25e6,50e6,100e6,250e6,500e6,1e9,1.5e9,2e9];

/* ============================================================
   POPULATION — classes, professions, générations, opinions
   ============================================================ */
function normalizePct(obj){
  const total = Object.values(obj).reduce((a,b)=>a+(isFinite(b)?b:0),0);
  if(!(total>0)){ const keys=Object.keys(obj); keys.forEach(k=> obj[k]=round1(100/keys.length)); return obj; }
  Object.keys(obj).forEach(k=> obj[k] = round1(Math.max(0,obj[k])/total*100));
  return obj;
}
function deriveDemographics(gdpPerCapita, rng){
  const dev = clamp(gdpPerCapita/40000, 0, 1);
  const classes = normalizePct({
    tresPauvres: clamp(34 - dev*30 + rand(rng,-3,3), 0.5, 45),
    pauvres:     clamp(30 - dev*16 + rand(rng,-3,3), 4, 40),
    moyenne:     clamp(20 + dev*22 + rand(rng,-3,3), 8, 48),
    moyenneSup:  clamp(9  + dev*15 + rand(rng,-2,2), 3, 30),
    riches:      clamp(5  + dev*7  + rand(rng,-1,1.5), 1, 15),
    ultraRiches: clamp(0.6+ dev*1.2+ rand(rng,-0.3,0.4), 0.1, 3),
  });
  const professions = normalizePct({
    agriculteurs:  clamp(30 - dev*26 + rand(rng,-3,3), 1, 42),
    ouvriers:      clamp(18 + dev*2  + rand(rng,-3,3), 5, 30),
    fonctionnaires:clamp(5  + dev*6  + rand(rng,-1,2), 2, 16),
    entrepreneurs: clamp(2  + dev*4  + rand(rng,-0.5,1), 1, 9),
    commercants:   clamp(8  + dev*3  + rand(rng,-2,2), 3, 16),
    enseignants:   clamp(2.5+ dev*2.5+ rand(rng,-0.5,1), 1, 8),
    medecins:      clamp(0.6+ dev*2  + rand(rng,-0.2,0.5), 0.2, 4),
    ingenieurs:    clamp(1  + dev*4  + rand(rng,-0.4,1), 0.4, 8),
    militaires:    clamp(1  + dev*1  + rand(rng,-0.3,0.8), 0.3, 5),
    etudiants:     clamp(12 + dev*4  + rand(rng,-2,2), 5, 24),
    retraites:     clamp(4  + dev*14 + rand(rng,-1,2), 2, 26),
    chomeurs:      clamp(9  - dev*3  + rand(rng,-2,3), 2, 30),
  });
  const generations = normalizePct({
    enfants:       clamp(38 - dev*22 + rand(rng,-2,2), 12, 46),
    adolescents:   clamp(11 - dev*3  + rand(rng,-1,1), 5, 15),
    jeunesAdultes: clamp(24 - dev*3  + rand(rng,-2,2), 14, 30),
    adultes:       clamp(23 + dev*13 + rand(rng,-2,2), 15, 44),
    seniors:       clamp(4  + dev*15 + rand(rng,-1,2), 2, 28),
  });
  return { classes, professions, generations };
}
function deriveSalaries(gdpPerCapita){
  const base = Math.max(40, Math.round(gdpPerCapita/12*0.62));
  const byProfession = {};
  PROFESSIONS.forEach(p=>{ byProfession[p.key] = p.salaryMult>0 ? Math.max(1, Math.round(base*p.salaryMult)) : 0; });
  return { minWage: Math.max(20, Math.round(base*0.55)), byProfession };
}
function costOfLiving(c){ return Math.max(20, Math.round((c.gdp*1e9/Math.max(1,c.population))/12*0.5)); }
/* Rapport entre les salaires décidés par le joueur et le salaire « naturel »
   du pays. >1 = le joueur paie mieux que ce que l'économie porte naturellement. */
function salaryPressure(c){
  if(!c.salaries || !c.salaries.byProfession) return 1;
  const nat = deriveSalaries(c.gdp*1e9/Math.max(1,c.population));
  let cur=0, ref=0;
  PROFESSIONS.forEach(p=>{
    if(p.salaryMult<=0) return;
    const w = (c.demographics && c.demographics.professions[p.key]) || 1;
    cur += (c.salaries.byProfession[p.key]||0)*w;
    ref += (nat.byProfession[p.key]||0)*w;
  });
  return ref>0 ? clamp(cur/ref, 0.2, 6) : 1;
}
/* Masse salariale publique mensuelle (indicative, affichée au joueur). */
function publicPayroll(c){
  if(!c.demographics || !c.salaries) return 0;
  let total = 0;
  PROFESSIONS.forEach(p=>{
    if(!p.publicPay) return;
    const count = c.population*((c.demographics.professions[p.key]||0)/100);
    if(p.key==='retraites') total += count*(c.salaries.minWage*((c.social.pensionLevel||40)/100));
    else if(p.key==='chomeurs') total += count*(c.salaries.minWage*((c.social.unemploymentBenefit||30)/100));
    else total += count*(c.salaries.byProfession[p.key]||0);
  });
  return Math.max(0, total);
}
function nationalIndicators(c){
  const sp = salaryPressure(c);
  const purchasing = clamp(50 + (sp-1)*70, 0, 100);
  const avgTax = ((c.budget.taxIncome||0)+(c.budget.taxCorporate||0))/2;
  let openness = c.social.immigration==='ouverte' ? 80 : (c.social.immigration==='quotas' ? 50 : 15);
  openness += (c.social.refugeePolicy==='accueil' ? 8 : -4);
  openness += clamp((c.social.naturalizationRate!=null?c.social.naturalizationRate:3)-3, -3, 12);
  const exploited = c.resources ? c.resources.filter(r=>r.exploited).length : 0;
  return {
    perf: {
      economie:   clamp(50 + c.economy.growth*5 - Math.max(0,c.economy.inflation-4)*1.6, 0, 100),
      travail:    clamp(purchasing*0.6 + (100 - c.economy.unemployment*2.4)*0.4, 0, 100),
      sante:      clamp(c.social.healthIndex, 0, 100),
      education:  clamp(c.social.educationIndex, 0, 100),
      securite:   clamp(100 - c.police.crimeIndex, 0, 100),
      justice:    clamp(c.police.justiceIndex!=null ? c.police.justiceIndex : 50, 0, 100),
      integrite:  clamp(100 - (c.social.corruption!=null ? c.social.corruption : 40), 0, 100),
      diplomatie: clamp(avgRelationScore(c.id), 0, 100),
    },
    pref: {
      impots:        clamp(avgTax*2, 0, 100),
      immigration:   clamp(openness, 0, 100),
      armee:         clamp(c.budget.spending.defense, 0, 100),
      environnement: clamp(60 - exploited*6 + (c.budget.spending.infra-50)*0.2, 0, 100),
      liberte:       clamp(c.social.liberty!=null ? c.social.liberty : 60, 0, 100),
      religion:      clamp(c.social.religiosity!=null ? c.social.religiosity : 45, 0, 100),
    },
  };
}
function groupTopicScore(groupKey, ind, topicKey){
  const prof = GROUP_PROFILES[groupKey] || {ideals:{}, weights:{}};
  if(ind.perf[topicKey]!=null) return clamp(ind.perf[topicKey], 0, 100);
  const ideal = (prof.ideals && prof.ideals[topicKey]!=null) ? prof.ideals[topicKey] : 50;
  return clamp(100 - Math.abs((ind.pref[topicKey]||0) - ideal)*1.5, 0, 100);
}
function groupSatisfaction(groupKey, ind){
  const prof = GROUP_PROFILES[groupKey] || {ideals:{}, weights:{}};
  let sum=0, wsum=0;
  OPINION_TOPICS.forEach(t=>{
    const w = (prof.weights && prof.weights[t.key]!=null) ? prof.weights[t.key] : 1;
    if(w<=0) return;
    sum += groupTopicScore(groupKey, ind, t.key)*w;
    wsum += w;
  });
  return wsum>0 ? clamp(sum/wsum, 0, 100) : 50;
}
/* Popularité nationale déduite des opinions réelles de chaque groupe,
   pondérée par son poids démographique (classes et professions). */
function opinionApproval(c){
  const d = c.demographics;
  if(!d) return null;
  const ind = nationalIndicators(c);
  let cs=0, cw=0, ps=0, pw=0;
  SOCIAL_CLASSES.forEach(g=>{ const w=d.classes[g.key]||0; cs += groupSatisfaction(g.key, ind)*w; cw += w; });
  PROFESSIONS.forEach(g=>{ const w=d.professions[g.key]||0; ps += groupSatisfaction(g.key, ind)*w; pw += w; });
  const cls = cw>0 ? cs/cw : 50;
  const pro = pw>0 ? ps/pw : 50;
  const v = (cls+pro)/2;
  return isFinite(v) ? clamp(v, 0, 100) : null;
}
/* Le chômage officiel et la part de chômeurs dans la population restent cohérents. */
/* ============================================================
   CHÔMAGE DÉTAILLÉ — qui est au chômage, et depuis combien de temps
   ============================================================ */
function unemploymentBreakdown(c){
  const u = c.economy.unemployment;
  const training = c.social.jobTraining!=null ? c.social.jobTraining : 30;
  const edu = c.social.educationIndex;
  const d = c.demographics;
  const kids = d && d.generations ? (d.generations.enfants||0) : 25;
  const activeShare = clamp((100-kids)/100, 0.3, 0.9);
  const totalUnemployed = Math.round(c.population*activeShare*(u/100));
  const youth = round1(clamp(u*(2.4 - training/140 - (edu-50)/300), 0, 95));
  const senior = round1(clamp(u*(0.75 + Math.max(0,u-10)/60), 0, 95));
  const longTerm = round1(clamp(46 - training*0.28 - (edu-50)*0.16 + Math.max(0,u-8)*0.9, 4, 88));
  const byProfession = PROFESSIONS.filter(p=>p.unempRisk>0).map(p=>{
    const share = d && d.professions ? (d.professions[p.key]||0) : 0;
    return { key:p.key, label:p.label, rate: round1(clamp(u*p.unempRisk, 0, 95)),
             people: Math.round(c.population*(share/100)*clamp(u*p.unempRisk,0,95)/100) };
  }).sort((a,b)=>b.rate-a.rate);
  return {
    rate: u, totalUnemployed, youth, senior, longTerm,
    longTermPeople: Math.round(totalUnemployed*longTerm/100),
    byProfession, training,
    benefitMonthly: Math.round((c.salaries?c.salaries.minWage:0)*((c.social.unemploymentBenefit||0)/100)),
  };
}
/* ============================================================
   NATIONALITÉ — citoyens, résidents étrangers, sans-papiers
   ============================================================ */
function nationalityBreakdown(c){
  const residents = Math.max(0, c.social.residents||0);
  const undocumented = Math.max(0, c.social.undocumented||0);
  const citizens = Math.max(0, c.population - residents - undocumented);
  const pctOf = n => c.population>0 ? round1(n/c.population*100) : 0;
  return {
    citizens, residents, undocumented,
    citizensPct: pctOf(citizens), residentsPct: pctOf(residents), undocumentedPct: pctOf(undocumented),
    naturalizedTotal: Math.max(0, c.social.naturalizedTotal||0),
    lastNaturalized: Math.max(0, c.social.lastNaturalized||0),
    naturalizationRate: c.social.naturalizationRate!=null ? c.social.naturalizationRate : 3,
  };
}
function topFlows(map, n){
  if(!map) return [];
  return Object.keys(map)
    .map(id=>({ id, count: map[id]||0 }))
    .filter(x=>x.count>0)
    .sort((a,b)=>b.count-a.count)
    .slice(0, n);
}
/* L'ascenseur social : de bons salaires et une économie saine font monter les
   ménages d'une classe à l'autre ; la stagnation et l'inflation les font descendre. */
function driftClasses(c, salPressure, housingBonus){
  const d = c.demographics;
  if(!d || !d.classes) return;
  const up = clamp((salPressure-1)*0.5 + c.economy.growth*0.04 - Math.max(0,c.economy.inflation-6)*0.02 + (housingBonus||0)*0.5, -0.35, 0.35);
  if(!isFinite(up) || Math.abs(up) < 0.005) return;
  const order = ['tresPauvres','pauvres','moyenne','moyenneSup','riches','ultraRiches'];
  for(let i=0;i<order.length-1;i++){
    const from = up>0 ? order[i] : order[i+1];
    const to   = up>0 ? order[i+1] : order[i];
    const move = (d.classes[from]||0)*Math.abs(up)*0.06;
    if(!(move>0) || !isFinite(move)) continue;
    d.classes[from] = Math.max(0, d.classes[from]-move);
    d.classes[to] = Math.max(0, (d.classes[to]||0)+move);
  }
  normalizePct(d.classes);
}
function syncProfessions(c){
  const d = c.demographics;
  if(!d || !d.professions) return;
  const kids = d.generations ? (d.generations.enfants||0) : 25;
  const workingShare = clamp((100 - kids)/100, 0.3, 0.9);
  const target = clamp(c.economy.unemployment*workingShare, 0.5, 40);
  const prev = d.professions.chomeurs||0;
  const delta = target - prev;
  if(!isFinite(delta) || Math.abs(delta) < 0.01) return;
  const movable = PROFESSIONS.filter(p=>['chomeurs','retraites','etudiants'].indexOf(p.key)<0).map(p=>p.key);
  const movableTotal = movable.reduce((a,k)=>a+(d.professions[k]||0),0);
  if(!(movableTotal>0)) return;
  d.professions.chomeurs = round1(target);
  movable.forEach(k=>{
    d.professions[k] = round1(clamp(d.professions[k] - delta*((d.professions[k]||0)/movableTotal), 0.1, 100));
  });
  normalizePct(d.professions);
}

function mediaClimate(c){
  const m = c.media || { publicFunding:40, pressFreedom:60 };
  const funding = clamp(m.publicFunding!=null?m.publicFunding:40, 0, 100);
  const freedom = clamp(m.pressFreedom!=null?m.pressFreedom:60, 0, 100);
  const corruption = c.social.corruption!=null ? c.social.corruption : 40;
  /* Financer ses médias et brider la presse achète une couverture favorable —
     au prix des libertés publiques et de la crédibilité du pays. */
  const favorability = clamp(50 + (funding-40)*0.35 - (freedom-60)*0.30 - Math.max(0, corruption-40)*0.25, 0, 100);
  /* Une presse libre et des réseaux sociaux actifs amplifient tout. */
  const amplification = clamp(0.6 + (freedom/100)*0.9, 0.6, 1.5);
  const scandalRisk = clamp((corruption/100)*(freedom/100)*0.6, 0, 0.6);
  return { favorability: round1(favorability), amplification, scandalRisk, funding, freedom };
}

const RESOLUTION_TYPES = [

/* Chaque membre vote selon sa relation avec la cible, avec le proposant,
   et selon son propre caractère national. */
function resolutionVote(org, targetId, typeKey){
  const type = RESOLUTION_TYPES.find(t=>t.key===typeKey);
  const pid = state.player.countryId;
  const members = orgMembers(org).filter(id=>id!==targetId);
  let yes=0, no=0;
  members.forEach(id=>{
    const toTarget = getRelation(id, targetId).score;
    const toPlayer = id===pid ? 100 : getRelation(id, pid).score;
    const pers = personalityOf(state.countries[id]||{});
    const support = (type && type.hostile)
      ? (50-toTarget)*0.05 + (toPlayer-50)*0.035 + (pers.warBias-1)*0.25
      : (toTarget-40)*0.03 + (toPlayer-50)*0.035 + (pers.aidBias-1)*0.30;
    if(support>0) yes++; else no++;
  });
  return { yes, no, total: members.length, passed: yes > members.length/2 };
}

const PARTIES = [
  {key:'conservateur', label:'Conservateurs',  color:'#5b8fc9', ideals:{impots:35,immigration:30,armee:65,environnement:40,liberte:55,religion:70}},
  {key:'liberal',      label:'Libéraux',       color:'#d3ac3a', ideals:{impots:15,immigration:65,armee:45,environnement:45,liberte:85,religion:35}},
  {key:'socialiste',   label:'Socialistes',    color:'#c1503a', ideals:{impots:65,immigration:60,armee:30,environnement:65,liberte:75,religion:30}},
  {key:'ecologiste',   label:'Écologistes',    color:'#4f9d6e', ideals:{impots:60,immigration:70,armee:20,environnement:95,liberte:85,religion:25}},
  {key:'nationaliste', label:'Nationalistes',  color:'#9a6fd1', ideals:{impots:40,immigration:10,armee:85,environnement:35,liberte:40,religion:65}},
  {key:'centriste',    label:'Centristes',     color:'#4fb8b0', ideals:{impots:45,immigration:50,armee:50,environnement:55,liberte:70,religion:45}},
];
function partyByKey(k){ return PARTIES.find(p=>p.key===k) || PARTIES[5]; }
/* Un groupe social ne vote pas d'un seul bloc : il répartit ses voix entre les
   partis, d'autant plus volontiers que le parti est proche de ses attentes. */
function partyWeights(groupKey){
  const g = GROUP_PROFILES[groupKey] || {ideals:{}};
  const w = {};
  let sum = 0;
  PARTIES.forEach(p=>{
    let d = 0;
    PREF_TOPICS.forEach(t=>{
      const gi = (g.ideals && g.ideals[t.key]!=null) ? g.ideals[t.key] : 50;
      d += Math.abs(gi - p.ideals[t.key]);
    });
    const a = Math.pow(1/(1 + d/40), 3);
    w[p.key] = a;
    sum += a;
  });
  if(sum>0) PARTIES.forEach(p=> w[p.key] = w[p.key]/sum);
  else PARTIES.forEach(p=> w[p.key] = 1/PARTIES.length);
  return w;
}
/* Les sièges découlent du vote réel des professions : chaque groupe soutient son
   parti naturel, et prête d'autant plus de voix au camp présidentiel qu'il est satisfait. */
function computeSeats(c){
  const d = c.demographics;
  if(!d || !state.parliament) return null;
  const ind = nationalIndicators(c);
  const pres = state.parliament.presidentialParty;
  const raw = {}; PARTIES.forEach(p=> raw[p.key]=0);
  PROFESSIONS.forEach(g=>{
    const w = d.professions[g.key]||0;
    if(!(w>0)) return;
    const weights = partyWeights(g.key);
    const swing = clamp((groupSatisfaction(g.key, ind)-50)/140, -0.3, 0.3);
    const toPres = (pres && swing>0) ? w*swing : 0;
    if(toPres>0) raw[pres] += toPres;
    const rest = Math.max(0, w - toPres);
    PARTIES.forEach(p=> raw[p.key] += rest*weights[p.key]);
  });
  /* Seuls les citoyens votent. Les naturalisés, eux, votent — et penchent
     nettement vers les partis les plus ouverts sur l'immigration. */
  if(c.social && c.population>0){
    const natShare = clamp((c.social.naturalizedTotal||0)/c.population*100, 0, 25);
    if(natShare>0){
      const lean = {socialiste:0.40, ecologiste:0.25, liberal:0.20, centriste:0.15};
      Object.keys(lean).forEach(k=> raw[k] += natShare*lean[k]);
    }
  }
  const total = Object.values(raw).reduce((a,b)=>a+b,0);
  const seatsTotal = state.parliament.total || 300;
  if(!(total>0)) return null;
  const seats = {};
  PARTIES.forEach(p=> seats[p.key] = Math.max(0, Math.round(raw[p.key]/total*seatsTotal)));
  let drift = seatsTotal - Object.values(seats).reduce((a,b)=>a+b,0);
  if(drift!==0){
    const k = pres || 'centriste';
    seats[k] = Math.max(0, (seats[k]||0) + drift);
  }
  return seats;
}
function coalitionSeats(){
  const pl = state.parliament;
  if(!pl || !pl.seats) return 0;
  const members = [pl.presidentialParty].concat(pl.coalition||[]);
  return members.reduce((a,k)=> a + (pl.seats[k]||0), 0);
}
function hasMajority(){
  const pl = state.parliament;
  if(!pl || !pl.seats) return false;
  return coalitionSeats() > (pl.total||300)/2;
}
function refreshParliament(){
  if(!state.parliament) return;
  const seats = computeSeats(playerState());
  if(seats) state.parliament.seats = seats;
}

function decreeCooldownLeft(c, key){
  const d = DECREES.find(x=>x.key===key);
  if(!d) return 0;
  const last = (c.decreesUsed||{})[key];
  if(last==null) return 0;
  return Math.max(0, d.cooldown - (state.player.turn-last));
}
function issueDecree(key){
  const c = playerState();
  const d = DECREES.find(x=>x.key===key);
  if(!d) return;
  const left = decreeCooldownLeft(c, key);
  if(left>0){ toast(`Décret indisponible encore ${left} mois.`); return; }
  const rng = mulberry32((hashCode(c.id+key+'decree') ^ (state.player.turn*50021)) >>> 0);
  const msg = d.fx(c, rng);
  if(!msg){ toast('Conditions non réunies pour ce décret (Trésor insuffisant ou rien à nationaliser).'); return; }
  c.decreesUsed = c.decreesUsed || {};
  c.decreesUsed[key] = state.player.turn;
  pushLog(msg, c);
  checkAchievements();
  saveGame(); render();
}

function lawVote(law){
  const pl = state.parliament;
  if(!pl || !pl.seats) return {yes:0, no:0, passed:false, total:0};
  let yes=0, no=0;
  PARTIES.forEach(p=>{
    const s = pl.seats[p.key]||0;
    if(!s) return;
    let stance = law.stance[p.key]!=null ? law.stance[p.key] : 0;
    /* Un parti allié suit plus volontiers le gouvernement ; l'opposition, elle,
       résiste par principe même quand le texte lui plaît à moitié. */
    const allied = p.key===pl.presidentialParty || (pl.coalition||[]).indexOf(p.key)>=0;
    stance += allied ? 0.4 : -0.35;
    if(stance > 0.05) yes += s;
    else if(stance < -0.05) no += s;
    else { yes += s*0.5; no += s*0.5; }
  });
  const total = pl.total||300;
  return {yes:Math.round(yes), no:Math.round(no), passed: yes > total/2, total};
}

    const capitalPop = base.pop*rand(rng,.08,.22);

    const remaining = Math.max(base.pop - capitalPop, base.pop*0.1);

            if(r.extraction==null) r.extraction = rebuilt.extraction;
            if(r.refining==null) r.refining = rebuilt.refining;
            if(r.grade==null) r.grade = rebuilt.grade;
            if(r.price==null) r.price = rebuilt.price;
            r.exploited = true;
          } else {
            if(r.reserves==null) r.reserves = Math.max(0, r.amount||0);
            if(r.baseCapacity==null) r.baseCapacity = 1;
            if(r.extraction==null) r.extraction = 100;
            if(r.refining==null) r.refining = 0;
            if(r.grade==null) r.grade = 1;
          }
          if(r.prevPrice==null) r.prevPrice = r.price;
          r.modelV = RESOURCE_MODEL_VERSION;
          delete r.amount;
        }
      });
      if(!c.social.origins) c.social.origins = {};
      if(!c.social.destinations) c.social.destinations = {};
      (c.cities||[]).forEach(city=>{
        city.infra = city.infra || {};
        const pop = city.population||0;
        const defaults = {
          roads:30, highways:0, railways:0, metro:0, bridges:0, airports:0, ports:0,
          schools: Math.max(1, Math.round(pop/60000)), universities: pop>300000?1:0,
          hospitals: Math.max(1, Math.round(pop/220000)), housing: Math.max(1, Math.round(pop/90000)),
        };
        INFRA_TYPES.forEach(t=>{ if(city.infra[t.key]==null) city.infra[t.key] = defaults[t.key]||0; });
      });
    });
    if(!state.history) state.history = [];
    if(!state.resolutions) state.resolutions = [];
    if(!state.espionageReports) state.espionageReports = {};
    if(!state.parliament){
      state.parliament = { total: 300, presidentialParty: 'centriste', coalition: [], seats: null, passedLaws: [], lastVote: null, electionsEnabled: true };
    }
    if(!state.parliament.coalition) state.parliament.coalition = [];
    if(!state.parliament.passedLaws) state.parliament.passedLaws = [];
    if(!state.parliament.total) state.parliament.total = 300;
    if(!state.parliament.presidentialParty) state.parliament.presidentialParty = 'centriste';
    if(state.parliament.electionsEnabled==null) state.parliament.electionsEnabled = true;
    if(state.defeated==null) state.defeated = false;
    try{ refreshParliament(); }catch(e){}
    if(!state.confederations.some(cf=>cf.preset)){
      PRESET_CONFEDERATIONS.forEach(preset=>{
        const members = preset.isoCodes.map(code=>COUNTRIES_DATA.find(x=>x.iso2===code)).filter(Boolean).map(x=>x.id).filter(id=>state.countries[id] && !state.countries[id].confederationId);
        if(members.length<2) return;
        const conf = { id: uid('conf'), name: preset.name, currency: preset.currency, members, founded: 0, preset: true };
        state.confederations.push(conf);
        members.forEach(id=>{ state.countries[id].confederationId = conf.id; });
        for(let i=0;i<members.length;i++){
          for(let j=i+1;j<members.length;j++) setRelation(members[i], members[j], {status:'alliance', score:70});
        }
      });
    }
    return true;
  }catch(e){ return false; }
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

  a.href = url; a.download = `sauvegarde-${slugifyName(countryName(state.player.countryId))}-tour${state.player.turn}.json`;

function slugifyName(s){ return String(s).toLowerCase().normalize('NFKD').replace(/[^\w]+/g,'-'); }
function importSaveFile(file){

  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !parsed.player || !parsed.countries) throw new Error('invalid');

function getCountryQuiet(id){ return state.countries[id]; }
function playerState(){ return state.countries[state.player.countryId]; }
