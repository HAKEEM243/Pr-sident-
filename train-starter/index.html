<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rail Empire — base de jeu de train</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0b1220;--card:#121c31;--line:#22314f;--fg:#e8eefc;--mut:#8da2c8;--gold:#ffd60a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
header b{color:var(--gold)}button,select{background:#1a2a4a;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
button.on{background:var(--gold);color:#111}main{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
#map{min-height:240px}aside{overflow:auto;padding:10px;background:var(--card);border-left:1px solid var(--line)}
.card{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:45% 55%}aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><b>🚆 Rail Empire</b><span id="clock"></span><span id="cash"></span><span style="flex:1"></span><span id="speeds"></span></header>
<main><div id="map"></div><aside id="panel"></aside></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="game.js"></script>
</body></html>
