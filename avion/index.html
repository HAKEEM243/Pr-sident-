<style>
:root{
  --bg:#0b1220; --panel:#0f1a2e; --card:#152238; --card2:#1b2b46; --line:#26395a; --txt:#e8eef8; --mut:#8fa0b8;

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* barre du haut */
#topbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(90deg,#0b1220,#122140);border-bottom:1px solid var(--line);z-index:1000;flex-wrap:wrap;min-height:46px}
#tb-name{display:flex;align-items:center;gap:8px;font-weight:700;min-width:0}
#tb-name .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font-size:17px;color:#0b1220;font-weight:800}
#tb-cash{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
#tb-time{font-variant-numeric:tabular-nums}
#tb-week{font-size:12.5px;font-variant-numeric:tabular-nums}
#tb-name .stars{font-size:12px}
.tb-sp{display:flex;gap:3px;margin-left:auto}
.tb-sp button{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
.tb-sp button.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
#main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#06101e}
/* panneau latéral */
#panel{position:absolute;top:0;right:0;bottom:0;width:440px;max-width:100%;background:rgba(11,18,32,.96);border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:1100;backdrop-filter:blur(6px);transition:transform .25s}

#tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
#tabs button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;padding:7px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mut)}
#tabs button small{font-size:10.5px}
#tabs button.on{color:var(--txt);border-bottom-color:var(--gold)}
#panelBody{flex:1;overflow-y:auto;padding:12px 12px 40px;overscroll-behavior:contain}
h2{margin:0 0 4px;font-size:18px} h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.mut{color:var(--mut)} .small{font-size:12px} .neg{color:var(--bad)} .pos{color:var(--ok)} .warnt{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.card.row,.row{display:flex;align-items:center;gap:10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin:6px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}

.btn.danger{border-color:#5b2530;color:#fca5a5}

.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;margin:2px 3px 2px 0;cursor:default}
button.chip{cursor:pointer} .chip.on{background:var(--gold);color:#111;border-color:var(--gold)} .chip.gold{border-color:var(--gold);color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0}
.badge{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;background:var(--card2);border:1px solid var(--line)}
.badge.fly{border-color:#1d5f8a;color:var(--blue)} .badge.maint{border-color:#7a5a12;color:var(--warn)} .badge.idle{color:var(--ok)}
.badge.ok{color:var(--ok);border-color:#1f6b4f} .badge.warn{color:var(--warn);border-color:#7a5a12} .badge.bad{color:var(--bad);border-color:#7a2a2a} .badge.rival{color:#fca5a5;border-color:#7a2a2a}
.pbar{height:6px;background:#0a1322;border-radius:4px;overflow:hidden;flex:1;min-width:50px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.pbar.warn i{background:var(--warn)} .pbar.bad i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.kpis.three{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kv{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.profile{display:flex;gap:12px;align-items:center}
.biglogo{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex-shrink:0}
.stars{color:var(--gold);letter-spacing:1px;font-size:15px}

.mts{display:grid;gap:3px}
.mt{display:flex;align-items:center;gap:8px;font-size:11.5px;font-variant-numeric:tabular-nums}
.mt span:first-child{width:12px;font-weight:700} .mt span:last-child{width:96px;text-align:right;color:var(--mut)}
.mt.due span{color:var(--warn)} .mt.over span{color:var(--bad)} .mt.over i{background:var(--bad)}
.route.losing{border-color:#7a2a2a}
.rhead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.arr{color:var(--gold)}
.legs{margin:6px 0}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;padding:4px 0;border-top:1px dashed #22344f}
.leg span:first-child{font-weight:700}
.ctrl{display:grid;gap:4px;margin:6px 0}
label{display:block;font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--gold)}
input:not([type=range]):not([type=checkbox]):not([type=color]),select{width:100%;background:#0a1322;border:1px solid var(--line);border-radius:7px;padding:7px 8px;color:var(--txt);font:inherit;margin-top:3px}

.tog{display:flex;gap:8px;align-items:center;margin:5px 0;cursor:pointer}

.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}

.stops{display:grid;gap:6px}
.stop{display:flex;gap:6px;align-items:center}
.stop .sn{width:66px;font-size:12px;color:var(--gold)}
.acpick{max-height:180px;overflow:auto}
.pilot{display:flex;gap:8px;align-items:center}
.drc-hero{position:relative;overflow:hidden;padding-top:16px;background:linear-gradient(135deg,#0a2b5c,#152238 70%)}
.flagbar{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--drc-blue) 0 40%,var(--gold) 40% 44%,var(--drc-red) 44% 56%,var(--gold) 56% 60%,var(--drc-blue) 60%)}

.board{background:#05080f;border:1px solid #2b2b2b;border-radius:8px;padding:6px 8px;margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.warnb{border-color:#7a5a12;background:#2a2210}

/* carte */
#mapctl{position:absolute;left:10px;top:84px;z-index:800;display:flex;flex-direction:column;gap:5px}

#flightlist{position:absolute;left:150px;top:84px;z-index:850;width:330px;max-height:calc(100% - 130px);display:flex;flex-direction:column;background:rgba(11,18,32,.96);border:1px solid var(--gold2);border-radius:12px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.5)}

.bigcta{display:flex;flex-direction:column;gap:8px;margin:8px 0}

#mapctl .globe3d{background:linear-gradient(135deg,#1d4ed8,#0e7490)!important;border-color:#7dd3fc!important;font-weight:700}
#globe{position:absolute;inset:0;z-index:1000;background:#000}

#city{position:absolute;inset:0;z-index:1000;background:#cfd8e3}

/* ---- application installée (plein écran) ---- */
